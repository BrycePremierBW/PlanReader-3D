name: F30 Real Benchmark

on:
  push:
    branches: [feat/f30-orthogonal-envelope-evidence]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f30-orthogonal-envelope-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Prepare main worktree
        run: git worktree add /tmp/planreader-main b54fd91d8bb843561eff6a54b42f74d77784e7d3
      - name: Download and verify scored sources
        run: |
          mkdir -p benchmarks/sources /tmp/planreader-main/benchmarks/sources
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o benchmarks/sources/1785347143869-bqs-drawings.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  benchmarks/sources/1785347143869-bqs-drawings.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' -o benchmarks/sources/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf
          echo 'c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  benchmarks/sources/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://umma.ac.ke/wp-content/uploads/2026/06/Builders-work.pdf' -o benchmarks/sources/umma-university-hostels-builders-work.pdf
          echo 'f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af  benchmarks/sources/umma-university-hostels-builders-work.pdf' | sha256sum -c -
          cp benchmarks/sources/*.pdf /tmp/planreader-main/benchmarks/sources/
      - name: Run same-source baseline on main
        working-directory: /tmp/planreader-main
        env:
          PYTHONPATH: .
        run: python pb_benchmark_accuracy_engine.py --all --output-dir /tmp/f30-main-results > /tmp/f30-main.txt
      - name: Run F30 candidate
        env:
          PYTHONPATH: .
        run: python pb_benchmark_accuracy_engine.py --all --output-dir /tmp/f30-candidate-results > /tmp/f30-candidate.txt
      - name: Compare score and item movements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(root):
              dashboard = json.loads((Path(root) / 'headline_accuracy_dashboard.json').read_text())
              projects = {}
              for report in dashboard['headline_reports']:
                  projects[report['benchmark_id']] = report
              return dashboard, projects

          main, main_projects = load('/tmp/f30-main-results')
          cand, cand_projects = load('/tmp/f30-candidate-results')

          print('MAIN_HEADLINE', main['headline_metrics'])
          print('CAND_HEADLINE', cand['headline_metrics'])
          for project_id in sorted(main_projects):
              a = main_projects[project_id]['summary']
              b = cand_projects[project_id]['summary']
              print('PROJECT', project_id)
              print('  MAIN', {k:a[k] for k in ('overall_accuracy_percentage','strict_exact_accuracy_percentage','exact_matches','within_5_percent','gross_mismatches','missed_items','hallucinated_items')})
              print('  CAND', {k:b[k] for k in ('overall_accuracy_percentage','strict_exact_accuracy_percentage','exact_matches','within_5_percent','gross_mismatches','missed_items','hallucinated_items')})

          ghazi_main = main_projects['tenders_ke_ghazi_science_lab']
          ghazi_cand = cand_projects['tenders_ke_ghazi_science_lab']
          for item_id in ('GZ-E3-B','GZ-E3-E','GZ-E8-D'):
              aa = next(x for x in ghazi_main['item_results'] if x['item_id'] == item_id)
              bb = next(x for x in ghazi_cand['item_results'] if x['item_id'] == item_id)
              print('GHAZI_ITEM', item_id)
              print('  MAIN', aa)
              print('  CAND', bb)

          assert main['headline_metrics']['overall_accuracy_percentage'] == 42.31
          assert cand['headline_metrics']['overall_accuracy_percentage'] >= main['headline_metrics']['overall_accuracy_percentage']
          for project_id in main_projects:
              assert cand_projects[project_id]['summary']['hallucinated_items'] <= main_projects[project_id]['summary']['hallucinated_items']
          PY