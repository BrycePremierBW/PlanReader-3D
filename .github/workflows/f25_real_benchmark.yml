name: F25 Real Development Benchmark

# Re-run marker: sparse-raster eligibility is now wired into the OCR lane.
on:
  push:
    branches:
      - codex/f25-portable-raster-ocr-main

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install benchmark and portable OCR dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
          pip install rapidocr==3.9.2 onnxruntime==1.29.0
      - name: Download hash-verified development PDFs
        run: |
          mkdir -p /tmp/f25-bench
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' -o /tmp/f25-bench/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/f25-bench/kstvet.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o /tmp/f25-bench/murera.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/f25-bench/murera.pdf' | sha256sum -c -
      - name: Run unchanged-gold benchmark and expose extraction deltas
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine
          from pb_public_tender_benchmark import PublicTenderBenchmark

          cases = [
              ('tenders_ke_kstvet_cbc_classroom', Path('/tmp/f25-bench/kstvet.pdf')),
              ('tenders_ke_murera_science_lab', Path('/tmp/f25-bench/murera.pdf')),
          ]
          engine = BenchmarkAccuracyEngine(output_dir='/tmp/f25-results')
          accepted = 0
          compared = 0
          for bid, pdf in cases:
              bench = PublicTenderBenchmark.load(bid, base_dir='benchmarks/public_tenders')
              target_pages = None
              for doc in bench.download_manifest.get('documents', []):
                  if doc.get('role') in ('architectural_drawings','drawings','tender_drawings'):
                      dp = doc.get('drawing_pages')
                      if dp and len(dp) == 2:
                          target_pages = list(range(dp[0]-1, dp[1]))
                          break
              preds = engine.extract_quantities_from_pdf(pdf, pages=target_pages)
              print('\nPREDICTIONS', bid)
              for p in sorted(preds, key=lambda x: str(x.get('tag',''))):
                  if p.get('trade_type') in ('windows','doors') or p.get('tag') in ('steel_casement_windows','doors_complete'):
                      print(' OPENING_PRED', p)
              report = engine.evaluate_benchmark(bid, pdf_path=pdf, predictions=preds)
              print('REPORT', bid, report.overall_accuracy_percentage, 'exact', report.exact_matches, 'within5', report.within_5_percent, 'gross', report.gross_mismatches, 'missed', report.missed_items, 'hallucinated', report.hallucinated_items)
              for item in report.item_results:
                  if item.item_id in ('steel_casement_windows','doors_complete','brick_vents') or item.status.value == 'hallucinated_item':
                      print(' ITEM', item.to_dict())
              accepted += report.exact_matches + report.within_5_percent
              compared += report.total_items_compared
          print('COMBINED_ACCEPTED', accepted, 'COMBINED_COMPARED', compared, 'COMBINED_PCT', round(accepted/compared*100,2) if compared else None)
          PY
      - name: Verify no benchmark leakage in production files
        run: |
          python scripts/check_benchmark_gold_separation.py
          ! grep -Ei 'kstvet|murera|expected_boq|benchmark_results|tenders_ke' pb_portable_raster_ocr.py pb_drawing_ocr_evidence_layer.py pb_planreader_pdf_extractor.py
