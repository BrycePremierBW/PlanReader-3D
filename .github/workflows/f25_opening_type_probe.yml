name: F25 Vent Population Source Probe

on:
  push:
    branches:
      - codex/f25-portable-raster-ocr-main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install source dependency
        run: pip install PyMuPDF==1.28.0
      - name: Download hash-verified Murera source
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o /tmp/murera.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/murera.pdf' | sha256sum -c -
      - name: Print vent counts, titles and positions on drawing pages
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import re
          import fitz

          doc=fitz.open('/tmp/murera.pdf')
          pv_re=re.compile(r'\bPV\b|\bPermanent\s+Vent\b|\bBrick\s+Vent\b',re.I)
          title_re=re.compile(r'(?:ELEVATION|ELEV\.?|FACADE|FAÇADE|SECTION)[^\n]{0,80}',re.I)
          for page_no in range(219,239):
              page=doc[page_no-1]
              text=page.get_text('text') or ''
              matches=list(pv_re.finditer(text))
              titles=title_re.findall(text)
              if matches or titles or 'elev' in text.lower():
                  print(f'\nPAGE {page_no} native_PV={len(matches)}')
                  print('TITLES',titles[:20])
                  words=page.get_text('words') or []
                  pv_words=[]
                  for w in words:
                      token=str(w[4]).strip()
                      if re.fullmatch(r'P\.?V\.?',token,re.I) or re.search(r'Permanent\s*Vent|Brick\s*Vent',token,re.I):
                          pv_words.append((round(float(w[0]),1),round(float(w[1]),1),round(float(w[2]),1),round(float(w[3]),1),token))
                  print('PV_WORDS',pv_words)
                  lines=[ln.strip() for ln in text.splitlines() if ln.strip()]
                  for i,ln in enumerate(lines):
                      if pv_re.search(ln) or re.search(r'elevation|facade|façade',ln,re.I):
                          lo=max(0,i-2); hi=min(len(lines),i+3)
                          print('CTX',' | '.join(lines[lo:hi]))
          doc.close()
          PY
