name: F24 Apply Patch

on:
  push:
    branches:
      - codex/f24-generic-opening-binding

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python scripts/f24_apply_patch.py
      - name: Commit patch
        run: |
          rm -f .github/workflows/f24_opening_evidence_diag.yml
          rm -f .github/workflows/f24_apply_patch.yml
          rm -f scripts/f24_apply_patch.py
          git config user.name "Bryce Curran"
          git config user.email "bryce@premierbw.com.au"
          git add -A
          git commit -m "F24: generic opening identity binding"
          git push origin HEAD:codex/f24-generic-opening-binding
