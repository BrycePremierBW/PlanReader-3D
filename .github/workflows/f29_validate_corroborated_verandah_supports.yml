name: F29 Corroborated Verandah Support Validation

on:
  push:
    branches:
      - feat/f29-corroborated-verandah-supports

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f29-corroborated-verandah-supports
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Wire document-level secondary-area support evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pb_planreader_pdf_extractor.py')
          source = path.read_text(encoding='utf-8')

          anchor1 = '        global_explicit_floor_area_evidence: List[Any] = []  # source-only figured FLOOR AREA evidence\n'
          replacement1 = anchor1 + '        global_secondary_area_support_evidence: List[Any] = []  # corroborated repeated-bay support evidence\n'
          if anchor1 not in source:
              raise SystemExit('F29 global evidence anchor not found')
          source = source.replace(anchor1, replacement1, 1)

          anchor2 = '''            from pb_dimension_chain_evidence_extractor import extract_dimension_chains_from_page\n            global_dimension_chains.extend(\n                extract_dimension_chains_from_page(doc[p_idx], page_num=p_idx + 1, view_id=f"page_{p_idx + 1}")\n            )\n'''
          replacement2 = '''            from pb_dimension_chain_evidence_extractor import extract_dimension_chains_from_page\n            page_dimension_chains = extract_dimension_chains_from_page(\n                doc[p_idx], page_num=p_idx + 1, view_id=f"page_{p_idx + 1}"\n            )\n            global_dimension_chains.extend(page_dimension_chains)\n\n            # F.29: count supports to a named secondary area only when two\n            # independent repeated-bay chains corroborate one another and\n            # spatially bind both the area label and an explicit support spec.\n            from pb_secondary_area_support_evidence import (\n                extract_secondary_area_support_evidence_from_page,\n            )\n            secondary_support_evidence = extract_secondary_area_support_evidence_from_page(\n                doc[p_idx],\n                source_page=p_idx + 1,\n                dimension_chains=page_dimension_chains,\n            )\n            if secondary_support_evidence is not None:\n                global_secondary_area_support_evidence.append(secondary_support_evidence)\n'''
          if anchor2 not in source:
              raise SystemExit('F29 dimension-chain anchor not found')
          source = source.replace(anchor2, replacement2, 1)

          anchor3 = '''        global_resolved_explicit_floor_area = resolve_explicit_floor_area_evidence(\n            global_explicit_floor_area_evidence\n        )\n\n        pred_dict: Dict[str, ExtractedPrediction] = {}\n'''
          replacement3 = '''        global_resolved_explicit_floor_area = resolve_explicit_floor_area_evidence(\n            global_explicit_floor_area_evidence\n        )\n\n        from pb_secondary_area_support_evidence import (\n            resolve_document_secondary_area_support_evidence,\n        )\n        global_resolved_secondary_support = resolve_document_secondary_area_support_evidence(\n            global_secondary_area_support_evidence\n        )\n\n        pred_dict: Dict[str, ExtractedPrediction] = {}\n\n        if (\n            global_resolved_secondary_support is not None\n            and global_resolved_secondary_support.zone_type == "verandah"\n        ):\n            support_page = global_resolved_secondary_support.source_pages[0]\n            support_sheet_no = self.extract_sheet_number(\n                doc[support_page - 1].get_text("text"), support_page\n            )\n            pred_dict["verandah_pillars"] = ExtractedPrediction(\n                tag="verandah_pillars",\n                trade_type="structure",\n                description=(\n                    f"Verandah structural {global_resolved_secondary_support.support_kind}s "\n                    f"from {global_resolved_secondary_support.bay_count} corroborated "\n                    "repeated bay spans"\n                ),\n                quantity=float(global_resolved_secondary_support.support_count),\n                unit="NO",\n                confidence=global_resolved_secondary_support.confidence,\n                source_page=support_page,\n                sheet_number=support_sheet_no,\n                metadata={\n                    "derivation": "corroborated_secondary_area_bay_support_count",\n                    "zone_type": global_resolved_secondary_support.zone_type,\n                    "support_kind": global_resolved_secondary_support.support_kind,\n                    "bay_count": global_resolved_secondary_support.bay_count,\n                    "bay_spans_m": list(global_resolved_secondary_support.bay_spans_m),\n                    "source_pages": list(global_resolved_secondary_support.source_pages),\n                    "chain_ids": list(global_resolved_secondary_support.chain_ids),\n                    "zone_text": global_resolved_secondary_support.zone_text,\n                    "support_text": global_resolved_secondary_support.support_text,\n                },\n            )\n'''
          if anchor3 not in source:
              raise SystemExit('F29 document-resolution anchor not found')
          source = source.replace(anchor3, replacement3, 1)

          path.write_text(source, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Run focused, full regression and safety gates
        run: |
          pytest -q tests/benchmarks/test_mutation_secondary_area_support_evidence.py
          pytest -q tests/benchmarks
          python scripts/check_benchmark_gold_separation.py
          python -m compileall -q pb_secondary_area_support_evidence.py pb_planreader_pdf_extractor.py
          ruff check --select F821,F823 pb_secondary_area_support_evidence.py pb_planreader_pdf_extractor.py tests/benchmarks/test_mutation_secondary_area_support_evidence.py
      - name: Download and verify four scored public sources
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o /tmp/murera.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/murera.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' -o /tmp/ghazi.pdf
          echo 'c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  /tmp/ghazi.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://umma.ac.ke/wp-content/uploads/2026/06/Builders-work.pdf' -o /tmp/umma.pdf
          echo 'f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af  /tmp/umma.pdf' | sha256sum -c -
      - name: Measure all four real headline projects
        run: |
          rm -rf /tmp/f29-results
          python scripts/run_planreader_benchmarks.py --public-tender tenders_ke_kstvet_cbc_classroom --pdf /tmp/kstvet.pdf --results-dir /tmp/f29-results/kstvet
          python scripts/run_planreader_benchmarks.py --public-tender tenders_ke_murera_science_lab --pdf /tmp/murera.pdf --results-dir /tmp/f29-results/murera
          python scripts/run_planreader_benchmarks.py --public-tender tenders_ke_ghazi_science_lab --pdf /tmp/ghazi.pdf --results-dir /tmp/f29-results/ghazi
          python scripts/run_planreader_benchmarks.py --public-tender tenders_ke_umma_hostels --pdf /tmp/umma.pdf --results-dir /tmp/f29-results/umma
          mkdir -p diagnostics
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          wanted = {
              'tenders_ke_kstvet_cbc_classroom',
              'tenders_ke_murera_science_lab',
              'tenders_ke_ghazi_science_lab',
              'tenders_ke_umma_hostels',
          }
          reports = {}
          for candidate in Path('/tmp/f29-results').rglob('*.json'):
              try:
                  data = json.loads(candidate.read_text(encoding='utf-8'))
              except Exception:
                  continue
              bid = data.get('benchmark_id')
              if bid in wanted and data.get('is_scored') and data.get('is_headline_eligible'):
                  reports[bid] = (data, candidate)
          if set(reports) != wanted:
              raise SystemExit(f'missing reports: {sorted(wanted - set(reports))}')
          totals = {
              'total_headline_benchmarks': len(reports),
              'total_measurable_expected': 0,
              'total_items_compared': 0,
              'exact_matches': 0,
              'within_5_percent': 0,
              'within_10_percent': 0,
              'within_20_percent': 0,
              'gross_mismatches': 0,
              'missed_items': 0,
              'hallucinated_items': 0,
          }
          per_project = {}
          for bid in sorted(reports):
              data, path = reports[bid]
              s = data['summary']
              for key in list(totals):
                  if key == 'total_headline_benchmarks':
                      continue
                  totals[key] += int(s.get(key, 0) or 0)
              per_project[bid] = s
              shutil.copyfile(path, f'diagnostics/f29_{bid}.json')
          compared = totals['total_items_compared']
          accepted = totals['exact_matches'] + totals['within_5_percent']
          totals['overall_accuracy_percentage'] = round(accepted / compared * 100.0, 2) if compared else 0.0
          totals['strict_exact_accuracy_percentage'] = round(totals['exact_matches'] / compared * 100.0, 2) if compared else 0.0
          out = {'headline_metrics': totals, 'per_project': per_project}
          Path('diagnostics/f29_candidate_headline.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2))
          PY
      - name: Commit validated integration and measurements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pb_planreader_pdf_extractor.py diagnostics/f29_*.json
          git commit -m 'F.29: wire corroborated verandah support evidence'
          git push origin HEAD:feat/f29-corroborated-verandah-supports
