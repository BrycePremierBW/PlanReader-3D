name: F28 Contextual WD Card Validation

on:
  push:
    branches:
      - feat/f28-fragmented-wd-card-binding

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f28-fragmented-wd-card-binding
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Wire additive WD evidence into the existing schedule extractor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pb_raster_schedule_extractor.py')
          source = path.read_text(encoding='utf-8')
          anchor = (
              '        card_rows = self._extract_card_style_schedules(page, page_num)\n'
              '        page_rows.extend(card_rows)\n\n'
              '        return page_rows\n'
          )
          addition = (
              '        card_rows = self._extract_card_style_schedules(page, page_num)\n'
              '        page_rows.extend(card_rows)\n\n'
              '        # F.28: a combined WD identity remains ambiguous globally.\n'
              '        # Resolve it only when same-card spatial evidence independently\n'
              '        # proves window semantics and the explicit card total.\n'
              '        from pb_contextual_wd_card_evidence import (\n'
              '            extract_contextual_wd_card_evidence,\n'
              '        )\n'
              '        for wd_evidence in extract_contextual_wd_card_evidence(\n'
              '            page, source_page=page_num\n'
              '        ):\n'
              '            page_rows.append(\n'
              '                ScheduleRow(\n'
              '                    tag=wd_evidence.tag,\n'
              '                    trade_type="windows",\n'
              '                    description=(\n'
              '                        f"{wd_evidence.raw_tag} card schedule, "\n'
              '                        "explicit Overall Quantity"\n'
              '                    ),\n'
              '                    quantity=wd_evidence.quantity,\n'
              '                    unit="NO",\n'
              '                    source_page=page_num,\n'
              '                    bbox=wd_evidence.bbox,\n'
              '                    confidence=0.90,\n'
              '                    evidence_text=wd_evidence.evidence_text,\n'
              '                )\n'
              '            )\n\n'
              '        return page_rows\n'
          )
          if anchor not in source:
              raise SystemExit('F28 integration anchor not found')
          path.write_text(source.replace(anchor, addition, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Run synthetic and benchmark regression suites
        run: |
          pytest -q tests/benchmarks/test_mutation_card_style_schedule.py tests/benchmarks/test_mutation_contextual_wd_card_evidence.py
          pytest -q tests/benchmarks
          python scripts/check_benchmark_gold_separation.py
          python -m compileall -q pb_contextual_wd_card_evidence.py pb_raster_schedule_extractor.py
          ruff check --select F821,F823 pb_contextual_wd_card_evidence.py pb_raster_schedule_extractor.py tests/benchmarks/test_mutation_contextual_wd_card_evidence.py
      - name: Download and verify unchanged Umma development source
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://umma.ac.ke/wp-content/uploads/2026/06/Builders-work.pdf' -o /tmp/umma.pdf
          echo 'f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af  /tmp/umma.pdf' | sha256sum -c -
      - name: Measure unchanged-gold Umma benchmark
        run: |
          rm -rf /tmp/f28-results
          python scripts/run_planreader_benchmarks.py --public-tender tenders_ke_umma_hostels --pdf /tmp/umma.pdf --results-dir /tmp/f28-results
          mkdir -p diagnostics
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil
          chosen = None
          for candidate in Path('/tmp/f28-results').rglob('*.json'):
              try:
                  data = json.loads(candidate.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if data.get('benchmark_id') == 'tenders_ke_umma_hostels':
                  chosen = candidate
                  break
          if chosen is None:
              raise SystemExit('Umma benchmark JSON result not found')
          shutil.copyfile(chosen, 'diagnostics/f28_umma_unchanged_gold_result.json')
          PY
      - name: Commit validated integration and measurement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pb_raster_schedule_extractor.py diagnostics/f28_umma_unchanged_gold_result.json
          git commit -m 'F.28: wire same-card WD window evidence into schedule extraction'
          git push origin HEAD:feat/f28-fragmented-wd-card-binding
