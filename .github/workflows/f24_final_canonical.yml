name: F24 Final Canonical Benchmark

on:
  push:
    branches:
      - diag/f24-final-canonical-20260909

jobs:
  canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0277a9bb492f12bb254d3c3e861c8496008e7d4e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download hash-verified public benchmark sources
        run: |
          mkdir -p benchmarks/sources
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o benchmarks/sources/1785347143869-bqs-drawings.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  benchmarks/sources/1785347143869-bqs-drawings.pdf' | sha256sum -c -
      - name: Run canonical summary without printing gold quantities
        env:
          PYTHONPATH: .
        run: |
          rm -rf /tmp/f24-final-canonical
          python pb_benchmark_accuracy_engine.py --all --output-dir /tmp/f24-final-canonical >/tmp/benchmark_engine.log
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/f24-final-canonical/headline_accuracy_dashboard.json').read_text())
          h = d['headline_metrics']
          print('BENCHMARKED_SHA 0277a9bb492f12bb254d3c3e861c8496008e7d4e')
          print('CANONICAL_HEADLINE', h['overall_accuracy_percentage'])
          print('COMPARED', h['total_items_compared'])
          print('EXACT', h['exact_matches'])
          print('WITHIN_5', h['within_5_percent'])
          print('WITHIN_10', h['within_10_percent'])
          print('WITHIN_20', h['within_20_percent'])
          print('GROSS', h['gross_mismatches'])
          print('MISSED', h['missed_items'])
          print('HALLUCINATED', h['hallucinated_items'])
          for report in d.get('headline_reports', []):
              s = report['summary']
              print('PROJECT', report['benchmark_id'], s['overall_accuracy_percentage'], s['total_items_compared'], s['exact_matches'], s['within_5_percent'], s['missed_items'], s['hallucinated_items'])
          PY
