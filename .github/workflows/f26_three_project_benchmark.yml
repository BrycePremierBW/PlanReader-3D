name: F26 Three Project Benchmark

on:
  push:
    branches: [feat/f26-explicit-floor-area-authority]

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
          pip install ruff
      - name: Download and verify development sources
        run: |
          mkdir -p /tmp/f26
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' -o /tmp/f26/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/f26/kstvet.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o /tmp/f26/murera.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/f26/murera.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' -o /tmp/f26/ghazi.pdf
          echo 'c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  /tmp/f26/ghazi.pdf' | sha256sum -c -
      - name: Static and focused validation
        run: |
          python -m compileall -q pb_explicit_floor_area_evidence.py pb_planreader_pdf_extractor.py
          ruff check --select F821,F823 pb_explicit_floor_area_evidence.py pb_planreader_pdf_extractor.py tests/benchmarks/test_mutation_explicit_floor_area_evidence.py
          python -m pytest -q tests/benchmarks/test_mutation_explicit_floor_area_evidence.py tests/benchmarks/test_mutation_component_floor_finish_geometry.py
          python scripts/check_benchmark_gold_separation.py
      - name: Run unchanged-gold headline benchmark
        run: |
          python - <<'PY'
          from pathlib import Path
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine
          from pb_public_tender_benchmark import PublicTenderBenchmark

          cases = [
              ('tenders_ke_kstvet_cbc_classroom', Path('/tmp/f26/kstvet.pdf')),
              ('tenders_ke_murera_science_lab', Path('/tmp/f26/murera.pdf')),
              ('tenders_ke_ghazi_science_lab', Path('/tmp/f26/ghazi.pdf')),
          ]
          engine = BenchmarkAccuracyEngine(output_dir='/tmp/f26/results')
          accepted = 0
          compared = 0
          summaries = {}

          for benchmark_id, pdf in cases:
              benchmark = PublicTenderBenchmark.load(
                  benchmark_id, base_dir='benchmarks/public_tenders'
              )
              pages = None
              for document in benchmark.download_manifest.get('documents', []):
                  if document.get('role') in ('architectural_drawings', 'drawings', 'tender_drawings'):
                      drawing_pages = document.get('drawing_pages')
                      if drawing_pages and len(drawing_pages) == 2:
                          pages = list(range(drawing_pages[0] - 1, drawing_pages[1]))
                          break

              predictions = engine.extract_quantities_from_pdf(pdf, pages=pages)
              report = engine.evaluate_benchmark(
                  benchmark_id, pdf_path=pdf, predictions=predictions
              )
              project_accepted = report.exact_matches + report.within_5_percent
              accepted += project_accepted
              compared += report.total_items_compared
              summaries[benchmark_id] = (
                  report.overall_accuracy_percentage,
                  project_accepted,
                  report.total_items_compared,
                  report.hallucinated_items,
              )

              print('\nPROJECT', benchmark_id)
              print(
                  'SUMMARY', report.overall_accuracy_percentage,
                  'accepted', project_accepted,
                  'exact', report.exact_matches,
                  'within5', report.within_5_percent,
                  'gross', report.gross_mismatches,
                  'missed', report.missed_items,
                  'hallucinated', report.hallucinated_items,
                  'total', report.total_items_compared,
              )
              for pred in predictions:
                  if pred.get('tag') in {
                      'floor_screed', 'substructure_bed_dpm',
                      'substructure_a142_mesh', 'substructure_surface_bed'
                  }:
                      print('AREA_PRED', pred)
              for item in report.item_results:
                  if (
                      benchmark_id == 'tenders_ke_ghazi_science_lab'
                      or item.item_id in {'BOQ-C45-A', 'substructure_bed_dpm'}
                  ):
                      print('ITEM', item.to_dict())

          overall = round(100.0 * accepted / compared, 2) if compared else 0.0
          print('\nF26_THREE_PROJECT_TOTAL', accepted, compared, overall)
          print('F26_PROJECT_SUMMARIES', summaries)

          # Guard the two established projects against accidental score loss.
          assert summaries['tenders_ke_kstvet_cbc_classroom'][1:3] == (2, 13)
          assert summaries['tenders_ke_murera_science_lab'][1:3] == (1, 11)
          PY
      - name: Remove temporary benchmark workflow
        if: always()
        run: |
          git config user.name "Bryce Curran"
          git config user.email "bryce@premierbw.com.au"
          rm -f .github/workflows/f26_three_project_benchmark.yml
          git add .github/workflows/f26_three_project_benchmark.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(F26): remove temporary benchmark workflow"
            git push origin HEAD:feat/f26-explicit-floor-area-authority
          fi
