name: F22 Benchmark Delta

on:
  push:
    branches:
      - feat/f22-bound-floor-envelope

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f22-bound-floor-envelope
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download verified development PDFs
        run: |
          curl -L --fail --retry 4 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' -o /tmp/kstvet.pdf
          curl -L --fail --retry 4 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o /tmp/murera.pdf
          echo "KSTVET $(sha256sum /tmp/kstvet.pdf | awk '{print $1}')"
          echo "MURERA $(sha256sum /tmp/murera.pdf | awk '{print $1}')"

      - name: Score current main baseline
        run: |
          git checkout --detach origin/main
          python - <<'PY'
          import json
          from pb_benchmark_accuracy_engine import run_public_tender_benchmark

          specs = [
              ('tenders_ke_kstvet_cbc_classroom', '/tmp/kstvet.pdf'),
              ('tenders_ke_murera_science_lab', '/tmp/murera.pdf'),
          ]
          reports = []
          for bid, pdf in specs:
              r = run_public_tender_benchmark(
                  benchmark_id=bid,
                  pdf_path=pdf,
                  auto_extract=True,
                  benchmarks_dir='benchmarks/public_tenders',
                  output_dir='/tmp/f22_baseline_results',
              )
              reports.append(r)
              floor = next((i for i in r.item_results if i.item_id == 'floor_finish_screed'), None)
              print('BASELINE_PROJECT', json.dumps({
                  'id': bid,
                  'compared': r.total_items_compared,
                  'exact': r.exact_matches,
                  'within5_nonexact': r.within_5_percent,
                  'accuracy': r.overall_accuracy_percentage,
                  'hallucinations': r.hallucinated_items,
                  'floor': floor.to_dict() if floor else None,
              }, sort_keys=True))
          total = sum(r.total_items_compared for r in reports)
          good = sum(r.exact_matches + r.within_5_percent for r in reports)
          print('BASELINE_COMBINED', json.dumps({'good': good, 'total': total, 'percent': 100.0 * good / total if total else None}, sort_keys=True))
          PY

      - name: Score F22 branch
        run: |
          git checkout feat/f22-bound-floor-envelope
          python - <<'PY'
          import json
          from pb_benchmark_accuracy_engine import run_public_tender_benchmark

          specs = [
              ('tenders_ke_kstvet_cbc_classroom', '/tmp/kstvet.pdf'),
              ('tenders_ke_murera_science_lab', '/tmp/murera.pdf'),
          ]
          reports = []
          for bid, pdf in specs:
              r = run_public_tender_benchmark(
                  benchmark_id=bid,
                  pdf_path=pdf,
                  auto_extract=True,
                  benchmarks_dir='benchmarks/public_tenders',
                  output_dir='/tmp/f22_branch_results',
              )
              reports.append(r)
              floor = next((i for i in r.item_results if i.item_id == 'floor_finish_screed'), None)
              print('F22_PROJECT', json.dumps({
                  'id': bid,
                  'compared': r.total_items_compared,
                  'exact': r.exact_matches,
                  'within5_nonexact': r.within_5_percent,
                  'accuracy': r.overall_accuracy_percentage,
                  'hallucinations': r.hallucinated_items,
                  'floor': floor.to_dict() if floor else None,
              }, sort_keys=True))
          total = sum(r.total_items_compared for r in reports)
          good = sum(r.exact_matches + r.within_5_percent for r in reports)
          print('F22_COMBINED', json.dumps({'good': good, 'total': total, 'percent': 100.0 * good / total if total else None}, sort_keys=True))
          PY

      - name: Remove temporary benchmark workflow
        if: always()
        run: |
          git checkout feat/f22-bound-floor-envelope
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f22_benchmark_delta.yml
          git commit -m 'chore: remove temporary F22 benchmark workflow'
          git push origin HEAD:feat/f22-bound-floor-envelope
