name: F28 Umma Card Semantic Evidence

on:
  push:
    branches:
      - diag/f28-umma-card-semantic-evidence

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f28-umma-card-semantic-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install probe dependency
        run: pip install PyMuPDF==1.28.0
      - name: Download and verify Umma development source
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://umma.ac.ke/wp-content/uploads/2026/06/Builders-work.pdf' -o /tmp/umma.pdf
          echo 'f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af  /tmp/umma.pdf' | sha256sum -c -
      - name: Persist schedule card evidence
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import json,re
          import fitz
          from pb_raster_schedule_extractor import GenericScheduleTableExtractor

          doc=fitz.open('/tmp/umma.pdf')
          ex=GenericScheduleTableExtractor()
          tag_re=re.compile(r'^\s*(?:WD|D)\s*[-_. ]?\s*0*\d{1,3}\s*$',re.I)
          report={
            'source_sha256':'f30711f69944e66ef993341180e35b49ccfcb36d6f402743284823ab588183af',
            'pages':[]
          }
          for page_no in (160,161,162):
              page=doc[page_no-1]
              blocks=[]
              for b in page.get_text('blocks') or []:
                  txt=' '.join(str(b[4]).split()).strip()
                  if not txt: continue
                  blocks.append({'text':txt,'bbox':[round(float(v),2) for v in b[:4]]})
              tags=[]
              for b in blocks:
                  if not tag_re.fullmatch(b['text']): continue
                  x0,y0,x1,y1=b['bbox']; cx=(x0+x1)/2; cy=(y0+y1)/2
                  nearby=[]
                  for q in blocks:
                      if q is b: continue
                      qx0,qy0,qx1,qy1=q['bbox']; qcx=(qx0+qx1)/2; qcy=(qy0+qy1)/2
                      dx=qcx-cx; dy=qcy-cy
                      if abs(dx)<=260 and abs(dy)<=220:
                          nearby.append({
                              'text':q['text'],
                              'bbox':q['bbox'],
                              'dx':round(dx,2),'dy':round(dy,2),
                              'distance':round((dx*dx+dy*dy)**0.5,2)
                          })
                  nearby.sort(key=lambda x:x['distance'])
                  tags.append({'tag_text':b['text'],'bbox':b['bbox'],'nearby_blocks':nearby[:45]})
              rows=[r.to_dict() for r in ex.extract_from_page(page,page_no) if r.trade_type in ('windows','doors')]
              relevant=[b for b in blocks if re.search(r'window|door|overall\s+quantity|opening|hung|casement|glaz|panel|flush|timber|steel|\bWD\s*[-_. ]?\s*0*\d|\bD\s*[-_. ]?\s*0*\d',b['text'],re.I)]
              report['pages'].append({
                  'page':page_no,
                  'native_text_chars':len(page.get_text('text') or ''),
                  'tag_cards':tags,
                  'relevant_blocks':relevant,
                  'current_extractor_rows':rows,
              })
          with open('diagnostics/f28_umma_card_semantic_evidence.json','w',encoding='utf-8') as f:
              json.dump(report,f,indent=2,ensure_ascii=False); f.write('\n')
          doc.close()
          PY
      - name: Commit diagnostic result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/f28_umma_card_semantic_evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diag(F28): persist Umma card semantic evidence'
          git push origin HEAD:diag/f28-umma-card-semantic-evidence
