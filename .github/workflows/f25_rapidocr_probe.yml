name: F25 Portable OCR Probe

on:
  push:
    branches:
      - codex/f25-portable-raster-ocr

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install OCR probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF==1.28.0 Pillow==12.3.0 numpy==2.3.5 rapidocr==3.9.2 onnxruntime==1.29.0
      - name: Download hash-verified development drawing source
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o /tmp/source_b.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/source_b.pdf' | sha256sum -c -
      - name: Sweep image-heavy sheets for explicit opening evidence
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import re
          import fitz
          import numpy as np
          from PIL import Image, ImageEnhance, ImageFilter
          from rapidocr import RapidOCR

          engine = RapidOCR()
          tag_re = re.compile(r'(?<![A-Za-z0-9])(?:W|D)\s*[-_.]?\s*\d{1,3}(?!\d)', re.I)
          interesting = re.compile(r'window|door|casement|glaz|schedule|type|mark|\bno\.?s?\b|\d{3,4}\s*[xX×*]\s*\d{3,4}', re.I)

          def tile_rects(page, cols=3, rows=3, overlap=.06):
              r=page.rect; tw=r.width/cols; th=r.height/rows
              for iy in range(rows):
                  for ix in range(cols):
                      yield fitz.Rect(max(r.x0,r.x0+ix*tw-tw*overlap), max(r.y0,r.y0+iy*th-th*overlap), min(r.x1,r.x0+(ix+1)*tw+tw*overlap), min(r.y1,r.y0+(iy+1)*th+th*overlap))

          def ocr_page(page, dpi=240):
              scale=72.0/dpi; found=[]
              for clip in tile_rects(page):
                  pix=page.get_pixmap(clip=clip,dpi=dpi,alpha=False)
                  img=Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
                  result=engine(np.asarray(img))
                  txts=getattr(result,'txts',None) or []; scores=getattr(result,'scores',None) or []; boxes=getattr(result,'boxes',None)
                  if boxes is None: continue
                  for i,raw in enumerate(txts):
                      text=' '.join(str(raw).split()).strip()
                      if not text: continue
                      pts=boxes[i].tolist() if hasattr(boxes[i],'tolist') else boxes[i]
                      xs=[float(p[0]) for p in pts]; ys=[float(p[1]) for p in pts]
                      x0=clip.x0+min(xs)*scale; y0=clip.y0+min(ys)*scale; x1=clip.x0+max(xs)*scale; y1=clip.y0+max(ys)*scale
                      found.append((text,float(scores[i]) if i<len(scores) else 0.0,(x0,y0,x1,y1)))
              kept=[]
              for text,conf,bbox in sorted(found,key=lambda x:-x[1]):
                  cx=(bbox[0]+bbox[2])/2; cy=(bbox[1]+bbox[3])/2
                  dup=False
                  for pt,pc,pb in kept:
                      if text.lower()!=pt.lower(): continue
                      pcx=(pb[0]+pb[2])/2; pcy=(pb[1]+pb[3])/2
                      # duplicate only when same OCR text substantially overlaps
                      ix=max(0,min(bbox[2],pb[2])-max(bbox[0],pb[0])); iy=max(0,min(bbox[3],pb[3])-max(bbox[1],pb[1])); inter=ix*iy
                      a=max(1,(bbox[2]-bbox[0])*(bbox[3]-bbox[1])); b=max(1,(pb[2]-pb[0])*(pb[3]-pb[1])); iou=inter/(a+b-inter) if a+b-inter>0 else 0
                      if iou>=0.35 or (abs(cx-pcx)<=5 and abs(cy-pcy)<=5): dup=True; break
                  if not dup: kept.append((text,conf,bbox))
              return kept

          doc=fitz.open('/tmp/source_b.pdf')
          candidates=[]
          for pno,page in enumerate(doc):
              imgs=len(page.get_images(full=True)); chars=len((page.get_text('text') or '').strip())
              # Broad source-structure sweep: image-heavy sheets only.
              if imgs>=5:
                  candidates.append((pno,imgs,chars))
          print('IMAGE_HEAVY_PAGES',[(p+1,i,c) for p,i,c in candidates])
          for pno,imgs,chars in candidates:
              rows=ocr_page(doc[pno])
              tags=[]; contexts=[]
              for text,conf,bbox in rows:
                  m=tag_re.search(text)
                  if m and conf>=0.70:
                      tags.append((m.group(0),round(conf,3),tuple(round(v,1) for v in bbox),text))
                  elif interesting.search(text) and conf>=0.70 and len(text)<=100:
                      contexts.append((round(conf,3),tuple(round(v,1) for v in bbox),text))
              print(f'PAGE {pno+1} images={imgs} native_chars={chars} tag_hits={len(tags)} context_hits={len(contexts)}')
              for row in tags: print(' TAG',row)
              for row in contexts[:30]: print(' CTX',row)
          doc.close()
          PY
