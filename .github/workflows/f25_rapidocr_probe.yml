name: F25 Portable OCR Probe

on:
  push:
    branches:
      - codex/f25-portable-raster-ocr

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install OCR probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF==1.28.0 Pillow==12.3.0 numpy==2.3.5 rapidocr==3.9.2 onnxruntime==1.29.0
      - name: Download hash-verified development drawing source
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o /tmp/source_b.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/source_b.pdf' | sha256sum -c -
      - name: Compare explicit tag detections across raster resolutions
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import re
          import fitz
          import numpy as np
          from PIL import Image, ImageEnhance
          from rapidocr import RapidOCR

          engine=RapidOCR()
          tag_re=re.compile(r'^\s*(?:W|D)\s*[-_.]?\s*\d{1,3}\s*$',re.I)
          doc=fitz.open('/tmp/source_b.pdf'); page=doc[227]
          r=page.rect
          def clips():
              cols=3; rows=3; ov=.06; tw=r.width/cols; th=r.height/rows
              for iy in range(rows):
                  for ix in range(cols):
                      yield fitz.Rect(max(r.x0,r.x0+ix*tw-tw*ov),max(r.y0,r.y0+iy*th-th*ov),min(r.x1,r.x0+(ix+1)*tw+tw*ov),min(r.y1,r.y0+(iy+1)*th+th*ov))
          for dpi in (180,220,260,300,340):
              detections=[]
              scale=72.0/dpi
              for clip in clips():
                  pix=page.get_pixmap(clip=clip,dpi=dpi,alpha=False)
                  img=Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
                  for variant_name,variant in (
                      ('raw',img),
                      ('contrast',ImageEnhance.Contrast(img).enhance(1.35)),
                  ):
                      result=engine(np.asarray(variant)); txts=getattr(result,'txts',None) or []; scores=getattr(result,'scores',None) or []; boxes=getattr(result,'boxes',None)
                      if boxes is None: continue
                      for i,text in enumerate(txts):
                          text=' '.join(str(text).split()).strip()
                          if not tag_re.fullmatch(text): continue
                          pts=boxes[i].tolist() if hasattr(boxes[i],'tolist') else boxes[i]
                          xs=[float(p[0]) for p in pts]; ys=[float(p[1]) for p in pts]
                          bbox=(clip.x0+min(xs)*scale,clip.y0+min(ys)*scale,clip.x0+max(xs)*scale,clip.y0+max(ys)*scale)
                          detections.append((text,float(scores[i]) if i<len(scores) else 0.0,bbox,variant_name))
              # spatially collapse exact-text duplicates produced by tile/variant overlap
              kept=[]
              for text,conf,bbox,variant in sorted(detections,key=lambda v:-v[1]):
                  cx=(bbox[0]+bbox[2])/2;cy=(bbox[1]+bbox[3])/2;dup=False
                  for pt,pc,pb,pv in kept:
                      if text.lower()!=pt.lower(): continue
                      pcx=(pb[0]+pb[2])/2;pcy=(pb[1]+pb[3])/2
                      ix=max(0,min(bbox[2],pb[2])-max(bbox[0],pb[0]));iy=max(0,min(bbox[3],pb[3])-max(bbox[1],pb[1]));inter=ix*iy
                      a=max(1,(bbox[2]-bbox[0])*(bbox[3]-bbox[1]));b=max(1,(pb[2]-pb[0])*(pb[3]-pb[1]));iou=inter/(a+b-inter) if a+b-inter else 0
                      if iou>=.25 or (abs(cx-pcx)<=6 and abs(cy-pcy)<=6):dup=True;break
                  if not dup:kept.append((text,conf,bbox,variant))
              print('DPI',dpi,'TAGS',[(t,round(c,3),round((b[0]+b[2])/2,1),round((b[1]+b[3])/2,1),v) for t,c,b,v in sorted(kept,key=lambda x:((x[2][1]+x[2][3])/2,(x[2][0]+x[2][2])/2))])
          doc.close()
          PY
