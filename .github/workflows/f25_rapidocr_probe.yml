name: F25 Portable OCR Probe

on:
  push:
    branches:
      - codex/f25-portable-raster-ocr

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install OCR probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF==1.28.0 Pillow==12.3.0 numpy==2.3.5 rapidocr==3.9.2 onnxruntime==1.29.0
      - name: Download hash-verified development drawing source
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o /tmp/source_b.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/source_b.pdf' | sha256sum -c -
      - name: Map OCR cells on source-discovered raster opening pages
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import math
          import re
          import fitz
          import numpy as np
          from PIL import Image
          from rapidocr import RapidOCR

          engine = RapidOCR()
          tag_re = re.compile(r'^\s*[WD]\s*[-.]?\s*\d{1,3}\s*$', re.I)

          def tile_rects(page):
              r = page.rect
              cols, rows = 3, 3
              overlap = 0.06
              tw, th = r.width / cols, r.height / rows
              for iy in range(rows):
                  for ix in range(cols):
                      x0 = max(r.x0, r.x0 + ix * tw - tw * overlap)
                      y0 = max(r.y0, r.y0 + iy * th - th * overlap)
                      x1 = min(r.x1, r.x0 + (ix + 1) * tw + tw * overlap)
                      y1 = min(r.y1, r.y0 + (iy + 1) * th + th * overlap)
                      yield fitz.Rect(x0, y0, x1, y1)

          def collect(page):
              rows = []
              dpi = 220
              scale = 72.0 / dpi
              for tile_idx, clip in enumerate(tile_rects(page), start=1):
                  pix = page.get_pixmap(clip=clip, dpi=dpi, alpha=False)
                  img = Image.frombytes('RGB', [pix.width, pix.height], pix.samples)
                  result = engine(np.asarray(img))
                  txts = getattr(result, 'txts', None) or []
                  scores = getattr(result, 'scores', None) or []
                  boxes = getattr(result, 'boxes', None)
                  if boxes is None:
                      continue
                  for i, raw in enumerate(txts):
                      text = ' '.join(str(raw).split()).strip()
                      if not text:
                          continue
                      box = boxes[i]
                      pts = box.tolist() if hasattr(box, 'tolist') else box
                      xs = [float(p[0]) for p in pts]
                      ys = [float(p[1]) for p in pts]
                      x0 = clip.x0 + min(xs) * scale
                      y0 = clip.y0 + min(ys) * scale
                      x1 = clip.x0 + max(xs) * scale
                      y1 = clip.y0 + max(ys) * scale
                      rows.append({
                          'text': text,
                          'conf': float(scores[i]) if i < len(scores) else 0.0,
                          'bbox': (x0,y0,x1,y1),
                          'cx': (x0+x1)/2.0,
                          'cy': (y0+y1)/2.0,
                          'tile': tile_idx,
                      })
              # De-duplicate overlapping tile detections by same text and nearby centre.
              kept = []
              for row in sorted(rows, key=lambda r: -r['conf']):
                  duplicate = False
                  for prior in kept:
                      if row['text'].lower() != prior['text'].lower():
                          continue
                      if abs(row['cx']-prior['cx']) <= 8 and abs(row['cy']-prior['cy']) <= 8:
                          duplicate = True
                          break
                  if not duplicate:
                      kept.append(row)
              return kept

          doc = fitz.open('/tmp/source_b.pdf')
          # These page numbers come only from the preceding source-structure OCR probe.
          for page_number in (228, 230):
              page = doc[page_number-1]
              rows = collect(page)
              print(f'PAGE {page_number} detections={len(rows)} size={page.rect.width:.1f}x{page.rect.height:.1f}')
              tags = [r for r in rows if tag_re.match(r['text'])]
              print('TAGS', [(r['text'], round(r['cx'],1), round(r['cy'],1), round(r['conf'],3)) for r in sorted(tags, key=lambda r:(r['cy'],r['cx']))])
              for tag in sorted(tags, key=lambda r:(r['cy'],r['cx'])):
                  nearby = []
                  for other in rows:
                      if other is tag:
                          continue
                      dx = other['cx'] - tag['cx']
                      dy = other['cy'] - tag['cy']
                      # Broad enough to expose column/row companions without
                      # assuming a particular schedule orientation.
                      if abs(dx) <= 220 and abs(dy) <= 90:
                          dist = math.hypot(dx, dy)
                          nearby.append((dist, dx, dy, other))
                  nearby.sort(key=lambda item:item[0])
                  print(f'NEIGHBORS tag={tag["text"]} at=({tag["cx"]:.1f},{tag["cy"]:.1f})')
                  for dist, dx, dy, other in nearby[:18]:
                      print(f'  N dist={dist:.1f} dx={dx:.1f} dy={dy:.1f} conf={other["conf"]:.3f} text={other["text"]}')
              print('ROW_ORDER')
              for r in sorted(rows, key=lambda r:(round(r['cy']/4)*4,r['cx'])):
                  # Keep diagnostic output bounded to schedule-like/numeric content.
                  if len(r['text']) <= 80 and (re.search(r'\d', r['text']) or re.search(r'window|door|casement|glass|glaz|size|type|no\.?', r['text'], re.I)):
                      print(f'  CELL x={r["cx"]:.1f} y={r["cy"]:.1f} conf={r["conf"]:.3f} text={r["text"]}')
          doc.close()
          PY
