name: F26 Trace Brick Vent Source

on:
  push:
    branches:
      - 'diag/f23-wall-opening-evidence'

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f23-wall-opening-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Trace source references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== phrase: total across facades ==='
          grep -Rni --exclude-dir=.git --exclude='*.json' --exclude='*.md' 'total across facades' . || true
          echo '=== phrase: brick_vents ==='
          grep -Rni --exclude-dir=.git 'brick_vents' . | head -200 || true
          echo '=== phrase: rectangular vent / facade ==='
          grep -Rni --exclude-dir=.git -E 'rectangular.{0,20}vent|vent.{0,20}rectangle|across facades|facade.*vent|vent.*facade' . | head -300 || true
          echo '=== extractor source occurrences ==='
          python - <<'PY'
          import inspect
          import pb_planreader_pdf_extractor as m
          print('module=',m.__file__)
          src=inspect.getsource(m.GenericPlanReaderExtractor.extract_from_pdf)
          for i,line in enumerate(src.splitlines(),1):
              if 'brick_vent' in line.lower() or 'facade' in line.lower() or 'vent_' in line.lower():
                  print(i, line)
          PY
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f26_trace_brick_vent_source.yml
          git commit -m 'chore: remove temporary F26 source trace'
          git push origin HEAD:diag/f23-wall-opening-evidence
