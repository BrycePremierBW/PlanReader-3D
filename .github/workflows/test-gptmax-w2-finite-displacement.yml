name: GPT MAX W2 Finite Displacement Guard
on:
  pull_request:
    paths:
      - pb_wall_room_topology_short_fragment_audit.py
      - tests/test_wall_room_topology_short_fragment_audit.py
      - .github/workflows/test-gptmax-w2-finite-displacement.yml
jobs:
  finite-displacement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: W2 source audit regression and two finite-coordinate overflow negatives
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_wall_room_topology_short_fragment_audit.py tests/test_gptmax_w2_short_fragment_source_diagnostic.py
          PYTHONPATH=. python scripts/check_provider_gold_isolation.py
          PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
