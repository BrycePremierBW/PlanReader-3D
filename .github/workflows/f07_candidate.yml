name: F07 Candidate
on:
  push:
    branches: [work/f07-viewport-segmentation]

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
      - name: Static checks
        run: |
          python -m compileall -q pb_viewport_segmentation.py pb_viewport_dimension_binding.py tests/benchmarks/test_mutation_viewport_segmentation.py tests/benchmarks/test_mutation_viewport_dimension_binding.py
          ruff check --select F821,F823 pb_viewport_segmentation.py pb_viewport_dimension_binding.py tests/benchmarks/test_mutation_viewport_segmentation.py tests/benchmarks/test_mutation_viewport_dimension_binding.py
          git diff --check
      - name: Focused F07 tests
        run: |
          pytest -q tests/benchmarks/test_mutation_viewport_segmentation.py tests/benchmarks/test_mutation_viewport_dimension_binding.py tests/benchmarks/test_mutation_figured_dimension_evidence.py tests/benchmarks/test_mutation_f13_nondestructive_chain_binding.py
