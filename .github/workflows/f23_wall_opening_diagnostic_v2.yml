name: F23 Wall Opening Diagnostic V2

on:
  push:
    branches:
      - 'diag/f23-wall-opening-evidence'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f23-wall-opening-evidence

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyMuPDF
        run: python -m pip install PyMuPDF==1.28.0

      - name: Inspect drawing evidence only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo "sha256=$(sha256sum /tmp/kstvet.pdf | awk '{print $1}')"
          python - <<'PY'
          import re
          import fitz
          from pb_level_datum_extraction import find_level_markers
          from pb_dimension_chain_evidence_extractor import (
              extract_dimension_chains_from_page,
              resolve_corroborated_wall_thickness_m,
          )
          from pb_dimension_graph_constraint_engine import resolve_wall_height
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          pdf='/tmp/kstvet.pdf'
          doc=fitz.open(pdf)
          extractor=GenericPlanReaderExtractor()

          print('=== DRAWING PAGE W1 OCCURRENCES ===')
          for p_idx in range(len(doc)):
              page=doc[p_idx]
              text=page.get_text('text')
              if not extractor.is_drawing_page(text):
                  continue
              if re.search(r'\bW1\b|\bW-?0*1\b', text, re.I):
                  print('PAGE', p_idx+1)
                  for i,line in enumerate(text.splitlines()):
                      if re.search(r'\bW1\b|\bW-?0*1\b|3000|3,000|casement|window', line, re.I):
                          print(f'  {i:04d}: {line}')
                  for b in page.get_text('blocks'):
                      btxt=b[4].strip().replace('\n',' ')
                      if re.search(r'\bW1\b|\bW-?0*1\b|3[,.]?000', btxt, re.I):
                          print('  BLOCK', tuple(round(x,1) for x in b[:4]), repr(btxt))

          print('\n=== PAGE 54 LEVEL / CHAIN EVIDENCE ===')
          page=doc[53]
          text=page.get_text('text')
          markers=find_level_markers(text, source_page=54, view_id='p54')
          print('level_markers=', markers)
          print('resolved_wall_height=', resolve_wall_height(markers))
          chains=extract_dimension_chains_from_page(page, page_num=54, view_id='p54')
          print('resolved_wall_thickness_m=', resolve_corroborated_wall_thickness_m(chains))
          for c in chains:
              vals=[round(o.value_m,4) for o in c.observations]
              if len(vals) >= 3 or any(2.0 <= v <= 4.0 for v in vals):
                  print('CHAIN', c.chain_id, 'sum=', round(c.segment_sum_m,4), 'vals=', vals,
                        'bboxes=', [tuple(round(v,1) for v in o.bbox) for o in c.observations])

          print('\n=== ALL DRAWING LEVEL MARKERS ===')
          all_markers=[]
          for p_idx in range(len(doc)):
              text=doc[p_idx].get_text('text')
              if extractor.is_drawing_page(text):
                  found=find_level_markers(text, source_page=p_idx+1, view_id=f'p{p_idx+1}')
                  if found:
                      print('PAGE', p_idx+1, found)
                      all_markers.extend(found)
          print('resolved_all_wall_height=', resolve_wall_height(all_markers))

          print('\n=== CURRENT EXTRACTOR SELECTED OUTPUTS ===')
          preds=extractor.extract_from_pdf(pdf)
          wanted={'W1','W2','D1','perimeter_walling','internal_plaster','internal_paint','external_key_pointing','external_render','verandah_pillars','structural_columns','floor_screed'}
          for p in preds:
              if p.tag in wanted:
                  print(p.to_dict())
          PY

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f23_wall_opening_diagnostic_v2.yml
          git commit -m 'chore: remove temporary F23 v2 diagnostic workflow'
          git push origin HEAD:diag/f23-wall-opening-evidence
