name: F21 Canonical Development Benchmark

on:
  push:
    branches:
      - feat/f21-internal-clear-floor-area
    paths:
      - .github/workflows/f21-benchmark-measure.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci-v1228.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt

      - name: Download and verify development benchmark source PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/planreader-bench"
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            --output "$RUNNER_TEMP/planreader-bench/kstvet.pdf"
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            --output "$RUNNER_TEMP/planreader-bench/murera.pdf"
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  '"$RUNNER_TEMP/planreader-bench/kstvet.pdf" | sha256sum --check
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  '"$RUNNER_TEMP/planreader-bench/murera.pdf" | sha256sum --check

      - name: Run canonical KSTVET diagnostic
        env:
          PYTHONPATH: .
        run: |
          mkdir -p "$RUNNER_TEMP/f21-results"
          python scripts/run_planreader_benchmarks.py \
            --public-tender tenders_ke_kstvet_cbc_classroom \
            --pdf "$RUNNER_TEMP/planreader-bench/kstvet.pdf" \
            --results-dir "$RUNNER_TEMP/f21-results"

      - name: Run canonical Murera diagnostic
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_planreader_benchmarks.py \
            --public-tender tenders_ke_murera_science_lab \
            --pdf "$RUNNER_TEMP/planreader-bench/murera.pdf" \
            --results-dir "$RUNNER_TEMP/f21-results"

      - name: Print combined headline and item transitions
        env:
          RESULTS_DIR: ${{ runner.temp }}/f21-results
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RESULTS_DIR'])
          ids = [
              'tenders_ke_kstvet_cbc_classroom',
              'tenders_ke_murera_science_lab',
          ]
          reports = []
          for bid in ids:
              path = root / f'{bid}_accuracy_report.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              reports.append(data)
              s = data['summary']
              print(f"PROJECT {bid}: accuracy={s['overall_accuracy_percentage']} exact={s['exact_matches']} within5={s['within_5_percent']} within10={s['within_10_percent']} gross={s['gross_mismatches']} missed={s['missed_items']} hallucinated={s['hallucinated_items']} compared={s['total_items_compared']}")
              for item in data['item_results']:
                  print('ITEM', bid, item['item_id'], item['status'], item['expected_quantity'], item['extracted_quantity'], item['pct_error'])

          total_compared = sum(r['summary']['total_items_compared'] for r in reports)
          total_exact = sum(r['summary']['exact_matches'] for r in reports)
          total_w5 = sum(r['summary']['within_5_percent'] for r in reports)
          headline = round((total_exact + total_w5) / total_compared * 100, 2) if total_compared else 0.0
          print(f'COMBINED_HEADLINE accuracy={headline} numerator={total_exact + total_w5} denominator={total_compared} exact={total_exact} within5={total_w5}')
          PY
