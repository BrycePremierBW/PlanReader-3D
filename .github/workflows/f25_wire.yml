name: F25 Portable OCR Wiring

on:
  push:
    branches:
      - codex/f25-portable-raster-ocr

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/f25-portable-raster-ocr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
          pip install rapidocr==3.9.2 onnxruntime==1.29.0
      - name: Apply and validate F25 wiring
        run: |
          python scripts/f25_wire_portable_ocr.py
          python -m compileall -q pb_portable_raster_ocr.py pb_drawing_ocr_evidence_layer.py pb_planreader_pdf_extractor.py
          ruff check --select F821,F823 pb_portable_raster_ocr.py pb_drawing_ocr_evidence_layer.py pb_planreader_pdf_extractor.py tests/benchmarks/test_mutation_portable_raster_opening_instances.py
          PYTHONPATH=. pytest -q \
            tests/benchmarks/test_mutation_portable_raster_opening_instances.py \
            tests/benchmarks/test_mutation_drawing_ocr_evidence.py \
            tests/benchmarks/test_mutation_ocr_evidence_layer_wiring.py \
            tests/benchmarks/test_mutation_generic_opening_binding_wiring.py \
            tests/benchmarks/test_mutation_generic_opening_tag_normalization.py
          ! grep -Ei 'kstvet|murera|expected_boq|benchmark_results|tenders_ke' pb_portable_raster_ocr.py pb_drawing_ocr_evidence_layer.py pb_planreader_pdf_extractor.py
      - name: Commit validated production change
        run: |
          git config user.name 'Bryce Curran'
          git config user.email 'bryce@premierbw.com.au'
          git rm .github/workflows/f25_wire.yml .github/workflows/f25_rapidocr_probe.yml scripts/f25_wire_portable_ocr.py
          git add pb_portable_raster_ocr.py pb_drawing_ocr_evidence_layer.py pb_planreader_pdf_extractor.py tests/benchmarks/test_mutation_portable_raster_opening_instances.py
          git diff --cached --check
          git commit -m 'feat(F25): recover explicit opening instances from portable raster OCR'
          git push origin HEAD:codex/f25-portable-raster-ocr
