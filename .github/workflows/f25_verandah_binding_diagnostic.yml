name: F25 Verandah Binding Diagnostic

on:
  push:
    branches:
      - 'diag/f23-wall-opening-evidence'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f23-wall-opening-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyMuPDF
        run: python -m pip install PyMuPDF==1.28.0
      - name: Inspect veranda label and dimension geometry
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          python - <<'PY'
          import re
          import fitz
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_dimension_chain_evidence_extractor import extract_dimension_chains_from_page

          doc=fitz.open('/tmp/murera.pdf')
          ex=GenericPlanReaderExtractor()
          for p_idx in range(len(doc)):
              page=doc[p_idx]
              text=page.get_text('text')
              if not ex.is_drawing_page(text):
                  continue
              words=page.get_text('words')
              veranda=[w for w in words if re.search(r'veranda',w[4],re.I)]
              dim15=[w for w in words if re.fullmatch(r'(?:1[,.]?500|1500|1[.]5(?:00)?)',w[4],re.I)]
              chains=extract_dimension_chains_from_page(page,page_num=p_idx+1,view_id=f'p{p_idx+1}')
              chains15=[]
              for c in chains:
                  vals=[o.value_m for o in c.observations]
                  if any(abs(v-1.5)<=0.01 for v in vals):
                      chains15.append(c)
              if veranda or dim15 or chains15:
                  print('\nPAGE',p_idx+1,'rect=',page.rect)
                  print('VERANDA_WORDS=',[(w[4],tuple(round(x,1) for x in w[:4])) for w in veranda])
                  print('DIM_1_5_WORDS=',[(w[4],tuple(round(x,1) for x in w[:4])) for w in dim15])
                  for c in chains15:
                      print('CHAIN_1_5',c.chain_id,'sum=',round(c.segment_sum_m,3),'obs=',[
                          (round(o.value_m,3),tuple(round(x,1) for x in o.bbox),o.raw_text) for o in c.observations
                      ])
                  for vw in veranda:
                      vx=(vw[0]+vw[2])/2; vy=(vw[1]+vw[3])/2
                      nearby=[]
                      for w in words:
                          wx=(w[0]+w[2])/2; wy=(w[1]+w[3])/2
                          if abs(wx-vx)<=180 and abs(wy-vy)<=140:
                              nearby.append((round(w[0],1),round(w[1],1),w[4]))
                      print('NEAR_VERANDA=',sorted(nearby,key=lambda x:(x[1],x[0])))
          PY
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f25_verandah_binding_diagnostic.yml
          git commit -m 'chore: remove temporary F25 verandah-binding diagnostic'
          git push origin HEAD:diag/f23-wall-opening-evidence
