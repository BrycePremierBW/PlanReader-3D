name: F24 Schedule OCR Probe

on:
  push:
    branches:
      - 'diag/f23-wall-opening-evidence'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f23-wall-opening-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install render dependency
        run: python -m pip install PyMuPDF==1.28.0 Pillow
      - name: OCR one schedule crop
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          python - <<'PY'
          import fitz
          doc=fitz.open('/tmp/murera.pdf')
          page=doc[222]
          clip=fitz.Rect(0, 170, 610, 455)
          pix=page.get_pixmap(matrix=fitz.Matrix(4,4), clip=clip, alpha=False)
          pix.save('/tmp/schedule.png')
          print('crop_px=',pix.width,pix.height)
          PY
          if command -v tesseract >/dev/null 2>&1; then
            echo '=== TESSERACT OCR ==='
            tesseract /tmp/schedule.png stdout -l eng --psm 6 2>/dev/null || true
          else
            echo 'tesseract_not_available'
          fi
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f24_schedule_ocr_probe.yml
          git commit -m 'chore: remove temporary F24 OCR diagnostic'
          git push origin HEAD:diag/f23-wall-opening-evidence
