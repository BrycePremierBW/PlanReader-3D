name: F31 Ghazi Vector Wall Probe

on:
  push:
    branches: [diag/f31-ghazi-vector-wall-network]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install PyMuPDF==1.28.0
      - name: Download hash-verified Ghazi source
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' -o /tmp/ghazi.pdf
          echo 'c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  /tmp/ghazi.pdf' | sha256sum -c -
      - name: Probe native vector geometry
        run: |
          python - <<'PY'
          import collections
          import math
          import re
          import fitz

          doc = fitz.open('/tmp/ghazi.pdf')
          page = doc[166]
          print('PAGE_RECT', tuple(round(v, 3) for v in page.rect))
          drawings = page.get_drawings()
          print('DRAWINGS_TOTAL', len(drawings))

          sigs = collections.Counter()
          item_types = collections.Counter()
          axis_segments = []
          rect_items = []

          def norm_color(value):
              if value is None:
                  return None
              try:
                  return tuple(round(float(v), 3) for v in value)
              except Exception:
                  return str(value)

          for di, drawing in enumerate(drawings):
              sig = (
                  round(float(drawing.get('width') or 0.0), 3),
                  norm_color(drawing.get('color')),
                  norm_color(drawing.get('fill')),
                  drawing.get('closePath'),
              )
              sigs[sig] += 1
              for item in drawing.get('items', []):
                  kind = item[0]
                  item_types[kind] += 1
                  if kind == 'l':
                      p1, p2 = item[1], item[2]
                      dx, dy = float(p2.x-p1.x), float(p2.y-p1.y)
                      length = math.hypot(dx, dy)
                      if length < 2.0:
                          continue
                      if abs(dy) <= 0.35:
                          orient = 'H'
                      elif abs(dx) <= 0.35:
                          orient = 'V'
                      else:
                          orient = 'D'
                      if orient in ('H','V'):
                          axis_segments.append({
                              'drawing': di,
                              'orient': orient,
                              'x1': round(min(p1.x,p2.x),3),
                              'x2': round(max(p1.x,p2.x),3),
                              'y1': round(min(p1.y,p2.y),3),
                              'y2': round(max(p1.y,p2.y),3),
                              'length': round(length,3),
                              'width': sig[0],
                              'color': sig[1],
                              'fill': sig[2],
                          })
                  elif kind == 're':
                      r = item[1]
                      rect_items.append({
                          'drawing': di,
                          'x0': round(r.x0,3), 'y0': round(r.y0,3),
                          'x1': round(r.x1,3), 'y1': round(r.y1,3),
                          'w': round(r.width,3), 'h': round(r.height,3),
                          'stroke_width': sig[0], 'color': sig[1], 'fill': sig[2],
                      })

          print('ITEM_TYPES', dict(item_types))
          print('\nTOP_DRAWING_SIGNATURES')
          for sig, count in sigs.most_common(20):
              print(count, sig)

          print('\nLONG_AXIS_SEGMENTS')
          for row in sorted(axis_segments, key=lambda r:r['length'], reverse=True)[:160]:
              if row['length'] >= 15:
                  print(row)

          print('\nTHIN_RECT_ITEMS')
          thin = [r for r in rect_items if min(r['w'],r['h']) <= 15 and max(r['w'],r['h']) >= 20]
          for row in sorted(thin, key=lambda r:max(r['w'],r['h']), reverse=True)[:160]:
              print(row)

          pat = re.compile(r'^\s*(\d{1,2})[,.]?(\d{3})\s*$')
          print('\nFIGURED_DIMENSION_TEXT')
          text_dict = page.get_text('dict') or {}
          for block in text_dict.get('blocks', []):
              for line in block.get('lines', []):
                  text = ' '.join(str(s.get('text','')) for s in line.get('spans', [])).strip()
                  m = pat.fullmatch(text)
                  if not m:
                      continue
                  val = float(m.group(1)) + float(m.group(2))/1000.0
                  if not (0.5 <= val <= 35):
                      continue
                  dx,dy = line.get('dir',(1.0,0.0))
                  orient = 'H' if abs(dx)>=0.85 and abs(dx)>=abs(dy) else ('V' if abs(dy)>=0.85 and abs(dy)>abs(dx) else 'D')
                  print({'m':round(val,3),'orient':orient,'dir':(round(dx,3),round(dy,3)),'bbox':tuple(round(float(v),3) for v in line['bbox']),'text':text})

          keywords = ('VERANDAH','LAB','STORE','PREP','OFFICE','ROOM','WORKTOP','SINK','PASSAGE','CORRIDOR','FLOOR AREA')
          print('\nSEMANTIC_TEXT_LINES')
          for block in text_dict.get('blocks', []):
              for line in block.get('lines', []):
                  text = ' '.join(str(s.get('text','')) for s in line.get('spans', [])).strip()
                  if text and any(k in text.upper() for k in keywords):
                      print({'bbox':tuple(round(float(v),3) for v in line['bbox']),'dir':tuple(round(float(v),3) for v in line.get('dir',(1,0))),'text':text})

          print('\nPARALLEL_PAIR_SEPARATIONS')
          pairs = []
          hs = [r for r in axis_segments if r['orient']=='H' and r['length']>=20]
          vs = [r for r in axis_segments if r['orient']=='V' and r['length']>=20]
          for rows, orient in ((hs,'H'),(vs,'V')):
              for i,a in enumerate(rows):
                  for b in rows[i+1:]:
                      if orient=='H':
                          sep = abs(a['y1']-b['y1'])
                          overlap = max(0.0, min(a['x2'],b['x2'])-max(a['x1'],b['x1']))
                          shorter = min(a['length'],b['length'])
                      else:
                          sep = abs(a['x1']-b['x1'])
                          overlap = max(0.0, min(a['y2'],b['y2'])-max(a['y1'],b['y1']))
                          shorter = min(a['length'],b['length'])
                      if 0.5 <= sep <= 12.0 and shorter > 0 and overlap/shorter >= 0.70:
                          pairs.append((round(sep,3), round(overlap/shorter,3), orient, a, b))
          sep_counts = collections.Counter(round(p[0],1) for p in pairs)
          print('PAIR_SEP_HIST', sep_counts.most_common(30))
          for pair in sorted(pairs, key=lambda p:(p[0],-p[1]))[:200]:
              print('PAIR', pair)

          doc.close()
          PY