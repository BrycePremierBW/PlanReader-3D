name: F22 Apply Component Floor Fix

on:
  push:
    branches:
      - feat/f22-bound-floor-envelope

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f22-bound-floor-envelope

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install focused dependencies
        run: python -m pip install PyMuPDF==1.28.0 pytest==8.4.2 ruff

      - name: Apply guarded extractor patch
        run: python scripts/f22_apply_component_floor_fix.py

      - name: Run F22 and adjacent mutation suites
        run: >-
          PYTHONPATH=. pytest -q
          tests/benchmarks/test_mutation_component_floor_finish_geometry.py
          tests/benchmarks/test_mutation_dimension_chain_evidence_extractor.py
          tests/benchmarks/test_mutation_multi_space_footprint.py

      - name: Compile lint and diff check
        run: |
          python -m compileall -q pb_planreader_pdf_extractor.py pb_component_floor_finish_geometry.py
          ruff check --select F821,F823 pb_planreader_pdf_extractor.py pb_component_floor_finish_geometry.py
          git diff --check

      - name: Commit verified F22 wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pb_planreader_pdf_extractor.py pb_component_floor_finish_geometry.py tests/benchmarks/test_mutation_component_floor_finish_geometry.py
          git rm -f scripts/f22_apply_component_floor_fix.py .github/workflows/f22_apply_component_floor_fix.yml
          git commit -m 'F.22: bind clear enclosed floor finish across compound footprint'
          git push origin HEAD:feat/f22-bound-floor-envelope
