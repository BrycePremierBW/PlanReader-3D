name: F22 Current Extractor Diagnostic

on:
  push:
    branches:
      - 'feat/f22-bound-floor-envelope'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f22-bound-floor-envelope

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install diagnostic dependency
        run: python -m pip install PyMuPDF==1.28.0

      - name: Run current extractor on public drawing only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo "sha256=$(sha256sum /tmp/kstvet.pdf | awk '{print $1}')"
          python - <<'PY'
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          preds = GenericPlanReaderExtractor().extract_from_pdf('/tmp/kstvet.pdf')
          by_tag = {p.tag: p for p in preds}
          for tag in (
              'floor_screed', 'perimeter_walling', 'damp_proof_course',
              'internal_plaster', 'internal_paint', 'substructure_bed_dpm',
              'substructure_a142_mesh', 'substructure_surface_bed',
              'W1', 'W2', 'D1'
          ):
              p = by_tag.get(tag)
              if p is None:
                  print(tag, 'MISSING')
              else:
                  print(tag, 'qty=', p.quantity, 'confidence=', p.confidence,
                        'dims=', p.dimensions, 'page=', p.source_page,
                        'metadata=', p.metadata)
          PY

      - name: Remove temporary diagnostic workflow from branch
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f22_current_extractor_diagnostic.yml
          git commit -m 'chore: remove temporary F22 extractor diagnostic workflow'
          git push origin HEAD:feat/f22-bound-floor-envelope
