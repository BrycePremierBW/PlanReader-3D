name: F29 Ghazi Current Failure Report

on:
  push:
    branches:
      - diag/f29-ghazi-current-failures

permissions:
  contents: write

jobs:
  measure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f29-ghazi-current-failures
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download and verify Ghazi source
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' -o /tmp/ghazi.pdf
          echo 'c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  /tmp/ghazi.pdf' | sha256sum -c -
      - name: Run current Ghazi benchmark
        run: |
          rm -rf /tmp/f29-ghazi-results
          python scripts/run_planreader_benchmarks.py --public-tender tenders_ke_ghazi_science_lab --pdf /tmp/ghazi.pdf --results-dir /tmp/f29-ghazi-results
          mkdir -p diagnostics
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          chosen = None
          for candidate in Path('/tmp/f29-ghazi-results').rglob('*.json'):
              try:
                  data = json.loads(candidate.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if data.get('benchmark_id') == 'tenders_ke_ghazi_science_lab':
                  chosen = candidate
                  break
          if chosen is None:
              raise SystemExit('Ghazi result not found')
          shutil.copyfile(chosen, 'diagnostics/f29_ghazi_current_result.json')
          PY
      - name: Persist result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/f29_ghazi_current_result.json
          git commit -m 'diag(F29): persist current Ghazi benchmark result'
          git push origin HEAD:diag/f29-ghazi-current-failures
