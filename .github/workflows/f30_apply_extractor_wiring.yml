name: F30 Apply Extractor Wiring

on:
  push:
    branches: [feat/f30-orthogonal-envelope-evidence]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[f30-wired]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f30-orthogonal-envelope-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact guarded wiring edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pb_planreader_pdf_extractor.py')
          source = path.read_text(encoding='utf-8')

          old = '''            length_m, width_m = self._detect_outer_envelope(parsed_dims_m, detected_span, is_elevation_page)\n\n            if length_m is not None and width_m is not None:\n'''
          new = '''            # F.30: a dense multi-room plan can carry multiple same-axis\n            # overall/sub-chain dimensions. Prefer a source-corroborated\n            # orthogonal envelope only when native text direction plus the\n            # drawing's own explicit FLOOR AREA resolve one unique geometry.\n            # Otherwise preserve the existing size-ranked heuristic unchanged.\n            page_explicit_floor_area = (\n                global_resolved_explicit_floor_area\n                if global_resolved_explicit_floor_area is not None\n                and page_num in global_resolved_explicit_floor_area.source_pages\n                else None\n            )\n            resolved_verandah_width_for_page = global_verandah_width\n            orthogonal_envelope_evidence = None\n            if not is_elevation_page and page_explicit_floor_area is not None:\n                from pb_orthogonal_envelope_evidence import (\n                    resolve_orthogonal_envelope_evidence,\n                )\n\n                orthogonal_envelope_evidence = resolve_orthogonal_envelope_evidence(\n                    page,\n                    explicit_floor_area_m2=page_explicit_floor_area.area_m2,\n                    secondary_width_m=global_verandah_width,\n                )\n\n            if orthogonal_envelope_evidence is not None:\n                length_m = orthogonal_envelope_evidence.length_m\n                width_m = orthogonal_envelope_evidence.width_m\n                if (\n                    resolved_verandah_width_for_page is None\n                    and orthogonal_envelope_evidence.secondary_width_m is not None\n                ):\n                    resolved_verandah_width_for_page = (\n                        orthogonal_envelope_evidence.secondary_width_m\n                    )\n            else:\n                length_m, width_m = self._detect_outer_envelope(\n                    parsed_dims_m, detected_span, is_elevation_page\n                )\n\n            if length_m is not None and width_m is not None:\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one envelope wiring site, found {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''                    builder.add_verandah(\n                        length_m=length_m,\n                        width_m=global_verandah_width,\n                        adjacency="front",\n'''
          new = '''                    builder.add_verandah(\n                        length_m=length_m,\n                        width_m=resolved_verandah_width_for_page,\n                        adjacency="front",\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one verandah builder site, found {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''                    elif global_verandah_width is not None and global_verandah_width > 0:\n                        desc_flr = f"Floor screed ({length_m}m x {width_m}m envelope + {length_m}m x {global_verandah_width}m verandah)"\n'''
          new = '''                    elif (\n                        resolved_verandah_width_for_page is not None\n                        and resolved_verandah_width_for_page > 0\n                    ):\n                        desc_flr = (\n                            f"Floor screed ({length_m}m x {width_m}m envelope + "\n                            f"{length_m}m x {resolved_verandah_width_for_page}m verandah)"\n                        )\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one floor description site, found {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''                            "derived_footprint_area_m2": derived_footprint_area_m2,\n                            **(\n                                {\n                                    "area_authority": explicit_floor_area_for_page.authority,\n'''
          new = '''                            "derived_footprint_area_m2": derived_footprint_area_m2,\n                            **(\n                                {\n                                    "envelope_authority": orthogonal_envelope_evidence.authority,\n                                    "orthogonal_horizontal_dimension_m": orthogonal_envelope_evidence.horizontal_m,\n                                    "orthogonal_vertical_dimension_m": orthogonal_envelope_evidence.vertical_m,\n                                    "orthogonal_corroborated_floor_area_m2": orthogonal_envelope_evidence.corroborated_area_m2,\n                                    "orthogonal_relative_area_error": orthogonal_envelope_evidence.relative_area_error,\n                                    **(\n                                        {\n                                            "secondary_width_m": orthogonal_envelope_evidence.secondary_width_m,\n                                            "secondary_width_source": (\n                                                "spatial_label_dimension"\n                                                if orthogonal_envelope_evidence.secondary_width_evidence is not None\n                                                else "upstream_secondary_width"\n                                            ),\n                                        }\n                                        if orthogonal_envelope_evidence.secondary_width_m is not None\n                                        else {}\n                                    ),\n                                }\n                                if orthogonal_envelope_evidence is not None\n                                else {}\n                            ),\n                            **(\n                                {\n                                    "area_authority": explicit_floor_area_for_page.authority,\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one floor metadata site, found {source.count(old)}')
          source = source.replace(old, new, 1)

          old = '''                            "footprint_status": footprint_res.status,\n                            "wall_height_source": (\n'''
          new = '''                            "footprint_status": footprint_res.status,\n                            **(\n                                {\n                                    "envelope_authority": orthogonal_envelope_evidence.authority,\n                                    "orthogonal_horizontal_dimension_m": orthogonal_envelope_evidence.horizontal_m,\n                                    "orthogonal_vertical_dimension_m": orthogonal_envelope_evidence.vertical_m,\n                                    "secondary_width_m": orthogonal_envelope_evidence.secondary_width_m,\n                                }\n                                if orthogonal_envelope_evidence is not None\n                                else {}\n                            ),\n                            "wall_height_source": (\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one wall metadata site, found {source.count(old)}')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY
      - name: Run focused wiring and regression tests
        run: |
          pip install pytest PyMuPDF==1.28.0 ruff
          export PYTHONPATH=.
          pytest -q \
            tests/benchmarks/test_mutation_orthogonal_envelope_evidence.py \
            tests/benchmarks/test_mutation_orthogonal_envelope_wiring.py \
            tests/benchmarks/test_mutation_explicit_floor_area_evidence.py \
            tests/benchmarks/test_mutation_f23_secondary_footprint_evidence.py \
            tests/benchmarks/test_mutation_secondary_area_support_evidence.py
          python -m compileall -q pb_planreader_pdf_extractor.py pb_orthogonal_envelope_evidence.py
          ruff check --select F821,F823 pb_planreader_pdf_extractor.py pb_orthogonal_envelope_evidence.py tests/benchmarks/test_mutation_orthogonal_envelope_evidence.py tests/benchmarks/test_mutation_orthogonal_envelope_wiring.py
      - name: Commit successful wiring and remove bootstrap workflow
        run: |
          rm .github/workflows/f30_apply_extractor_wiring.yml
          git config user.name 'BrycePremierBW'
          git config user.email 'bryce@premierbw.com.au'
          git add pb_planreader_pdf_extractor.py .github/workflows/f30_apply_extractor_wiring.yml
          git commit -m 'feat(F30): prefer source-corroborated orthogonal plan envelope [f30-wired]'
          git push origin HEAD:feat/f30-orthogonal-envelope-evidence