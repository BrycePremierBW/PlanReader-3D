name: F24 Murera Verandah Geometry Diagnostic

on:
  push:
    branches: [work/f24-generic-opening-schedule-reconstruction]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused dependencies
        run: pip install 'PyMuPDF==1.28.0'
      - name: Download verified public Murera drawing
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/murera.pdf' | sha256sum -c -
      - name: Inspect architectural floor-plan and section dimension evidence
        run: |
          python - <<'PY'
          import fitz, re
          doc = fitz.open('/tmp/murera.pdf')
          title_pat = re.compile(r'floor plan|ground floor|section|elevation|roof plan|veranda', re.I)
          num_pat = re.compile(r'^(?:\d{2,5}|\d{1,2}[,.]\d{3})$')

          for pno in range(217, 225):
              page = doc[pno]
              text = page.get_text('text') or ''
              words = list(page.get_text('words'))
              blocks = list(page.get_text('blocks'))
              interesting = []
              for i, b in enumerate(blocks):
                  s = ' '.join(str(b[4]).split())
                  if title_pat.search(s):
                      interesting.append((i, [round(float(x),2) for x in b[:4]], s[:500]))
              if interesting:
                  print('\n=== PAGE', pno + 1, '===')
                  for row in interesting:
                      print('CONTEXT', *row)
                  print('NUMERIC_WORDS')
                  for w in words:
                      token = str(w[4]).strip().replace(' ', '')
                      if num_pat.match(token):
                          print('NUM', [round(float(x),2) for x in w[:4]], repr(token))

          # Page-level typed figured-dimension chains from the production F.13/F.15 parser,
          # printed only as raw drawing evidence / chain structure.
          from pb_dimension_chain_evidence_extractor import extract_dimension_chains_from_page
          for pno in range(217, 225):
              page = doc[pno]
              chains = extract_dimension_chains_from_page(page, page_num=pno + 1, view_id='')
              if chains:
                  print('\n=== CHAINS PAGE', pno + 1, '===')
                  for chain in chains:
                      vals = [round(o.value_m,4) for o in chain.observations]
                      texts = [o.raw_text for o in chain.observations]
                      print('CHAIN', chain.chain_id, vals, texts)
          PY
