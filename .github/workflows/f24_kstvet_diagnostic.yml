name: F24 KSTVET Diagnostic

on:
  push:
    branches: [work/f24-generic-opening-schedule-reconstruction]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyMuPDF
        run: pip install 'PyMuPDF==1.28.0'
      - name: Download verified public drawing
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/drawing.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/drawing.pdf' | sha256sum -c -
      - name: Inspect opening evidence
        run: |
          python - <<'PY'
          import fitz, re
          doc = fitz.open('/tmp/drawing.pdf')
          print('PAGE_COUNT', len(doc))
          pat = re.compile(r'W\s*1|3[,\.]?000|window|casement', re.I)
          for pno, page in enumerate(doc):
              text = page.get_text('text')
              if not pat.search(text):
                  continue
              print(f'=== PAGE {pno+1} TEXT ===')
              for line in text.splitlines():
                  if pat.search(line):
                      print('LINE', repr(line))
              print(f'=== PAGE {pno+1} BLOCKS ===')
              for i, b in enumerate(page.get_text('blocks')):
                  s = str(b[4]).replace('\n', ' | ')
                  if pat.search(s):
                      print('BLOCK', i, [round(float(x),2) for x in b[:4]], repr(s))
              print(f'=== PAGE {pno+1} WORD ROWS ===')
              words = page.get_text('words')
              rows = {}
              for w in words:
                  y = round(float(w[1]) / 4.0) * 4.0
                  rows.setdefault(y, []).append(w)
              for y, ws in sorted(rows.items()):
                  s = ' '.join(str(w[4]) for w in sorted(ws, key=lambda z: z[0]))
                  if pat.search(s):
                      print('ROW', y, repr(s))
          PY
