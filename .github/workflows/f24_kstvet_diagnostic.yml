name: F24 Murera Drawing Diagnostic

on:
  push:
    branches: [work/f24-generic-opening-schedule-reconstruction]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused dependencies
        run: pip install 'PyMuPDF==1.28.0' 'Pillow==12.3.0'
      - name: Download verified public Murera drawing
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/murera.pdf' | sha256sum -c -
      - name: Inspect candidate drawing pages 220 through 226
        run: |
          python - <<'PY'
          import fitz, re
          doc = fitz.open('/tmp/murera.pdf')
          pat = re.compile(r'window|door|casement|schedule|elevation|floor plan|section|drawing|\bW\s*\d+\b|\bD\s*\d+\b', re.I)
          for pno in range(219, 226):
              page = doc[pno]
              print('\n=== PDF_PAGE', pno + 1, 'SIZE', round(page.rect.width,2), round(page.rect.height,2), '===')
              text = page.get_text('text') or ''
              print('TEXT_CHARS', len(text.strip()), 'IMAGES', len(page.get_images(full=True)), 'DRAWINGS', len(page.get_drawings()))
              print('TEXT_START', repr(text[:1200]))
              for i, b in enumerate(page.get_text('blocks')):
                  s = ' '.join(str(b[4]).split())
                  if pat.search(s):
                      print('TEXT_BLOCK', i, [round(float(x),2) for x in b[:4]], repr(s[:500]))
              for i, image in enumerate(page.get_images(full=True)):
                  xref = image[0]
                  rects = page.get_image_rects(xref)
                  info = doc.extract_image(xref)
                  print(
                      'IMAGE', i,
                      'xref', xref,
                      'pixel_size', (info.get('width'), info.get('height')),
                      'ext', info.get('ext'),
                      'rects', [[round(r.x0,2), round(r.y0,2), round(r.x1,2), round(r.y1,2)] for r in rects],
                  )
          PY
