name: F24 Murera Floor Plan Geometry Diagnostic

on:
  push:
    branches: [work/f24-generic-opening-schedule-reconstruction]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused dependencies
        run: pip install 'PyMuPDF==1.28.0'
      - name: Download verified public Murera drawing
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/murera.pdf' | sha256sum -c -
      - name: Inspect plan-scale evidence and CAD linework
        run: |
          python - <<'PY'
          import fitz, re, math
          doc = fitz.open('/tmp/murera.pdf')
          num_pat = re.compile(r'^[0-9][0-9,.]{2,8}$')
          for pno in range(217, 221):
              page = doc[pno]
              print('\n=== PAGE', pno + 1, 'SIZE', page.rect, '===')
              text = page.get_text('text') or ''
              print('TEXT', repr(text[:4000]))
              raw = page.get_text('dict')
              print('FIGURED_LINES')
              for block in raw.get('blocks', []):
                  if block.get('type') != 0:
                      continue
                  for line in block.get('lines', []):
                      line_text = ''.join(span.get('text','') for span in line.get('spans', [])).strip()
                      compact = line_text.replace(' ', '')
                      if num_pat.match(compact) or 'VERANDA' in line_text.upper() or 'PLAN' in line_text.upper():
                          print('LINE', 'dir', line.get('dir'), 'bbox', [round(float(x),2) for x in line.get('bbox',())], repr(line_text))
              # Axis-aligned native line segments, grouped by long spans.
              segs=[]
              for pi, path in enumerate(page.get_drawings()):
                  for item in path.get('items',[]):
                      if not item or item[0] != 'l':
                          continue
                      a,b=item[1],item[2]
                      x0,y0,x1,y1=map(float,(a.x,a.y,b.x,b.y))
                      length=math.hypot(x1-x0,y1-y0)
                      if length >= 20 and (abs(y1-y0) <= 0.5 or abs(x1-x0) <= 0.5):
                          segs.append((length,x0,y0,x1,y1,pi))
              print('LONG_AXIS_SEGMENTS', len(segs))
              for row in sorted(segs, reverse=True)[:80]:
                  print('SEG', round(row[0],2), [round(v,2) for v in row[1:5]], 'path', row[5])
          PY
