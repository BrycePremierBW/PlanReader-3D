name: F24 Murera Native Opening Diagnostic

on:
  push:
    branches: [work/f24-generic-opening-schedule-reconstruction]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused dependencies
        run: pip install 'PyMuPDF==1.28.0'
      - name: Download verified public Murera drawing
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/murera.pdf' | sha256sum -c -
      - name: Trace opening tags, dimensions and drawing titles
        run: |
          python - <<'PY'
          import fitz, re
          doc = fitz.open('/tmp/murera.pdf')
          tag_pat = re.compile(r'\b(?:W|D)\s*[-_]?\s*\d{1,2}\b', re.I)
          dim_pat = re.compile(r'\b\d{3,4}\s*(?:mm)?\s*[xX]\s*\d{3,4}\s*(?:mm)?\b', re.I)
          keyword_pat = re.compile(r'window|door|casement|fixed glass|opening', re.I)
          title_pat = re.compile(r'floor plan|roof plan|elevation|section|detail|drawing title|schedule', re.I)

          # Restrict diagnostics to the architectural drawing tail, not tender/BOQ pages.
          for pno in range(217, len(doc)):
              page = doc[pno]
              blocks = list(page.get_text('blocks'))
              matches = []
              titles = []
              for i, b in enumerate(blocks):
                  s = ' '.join(str(b[4]).split())
                  bbox = [round(float(x),2) for x in b[:4]]
                  if title_pat.search(s):
                      titles.append((i, bbox, s[:300]))
                  if tag_pat.search(s) or dim_pat.search(s) or keyword_pat.search(s):
                      matches.append((i, bbox, s[:500]))
              if matches or titles:
                  print('\n=== PAGE', pno + 1, '===')
                  for row in titles:
                      print('TITLE', *row)
                  for row in matches:
                      print('OPENING', *row)

          # Detailed word-level evidence on the steel-casement sheet.
          page = doc[222]
          print('\n=== PAGE 223 WORDS AROUND OPENING ZONES ===')
          words = page.get_text('words')
          for w in words:
              text = str(w[4])
              if tag_pat.search(text) or any(k in text.lower() for k in ('steel','casement','glass','window','door')) or re.fullmatch(r'[0-9,]{3,5}', text):
                  print('WORD', [round(float(x),2) for x in w[:4]], repr(text))
          PY
