name: F31 Apply Morphology Fix

on:
  push:
    branches: [feat/f31-raster-wall-network-evidence]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[f31-morphology]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f31-raster-wall-network-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic morphology supplement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pb_raster_wall_network_evidence.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('def _axis_line_groups(')
          end = source.index('\n\ndef _nearest_group(', start)
          replacement = '''def _axis_line_groups(binary: np.ndarray) -> tuple[list[_LineGroup], list[_LineGroup]]:\n    height, width = binary.shape[:2]\n    edges = cv2.Canny(binary, 50, 150, apertureSize=3)\n    short_side = float(min(height, width))\n    min_line = max(28, int(round(short_side * 0.035)))\n    threshold = max(35, int(round(short_side * 0.035)))\n    max_gap = max(4, int(round(short_side * 0.004)))\n\n    horizontal: list[tuple[float, float, float]] = []\n    vertical: list[tuple[float, float, float]] = []\n\n    # Probabilistic Hough remains useful for sparse / slightly imperfect\n    # linework, but it is not the sole source of edge evidence.  A missed edge\n    # on one side of a door opening must not erase an otherwise documented\n    # double-line masonry wall.\n    raw = cv2.HoughLinesP(\n        edges,\n        1,\n        np.pi / 180.0,\n        threshold=threshold,\n        minLineLength=min_line,\n        maxLineGap=max_gap,\n    )\n    if raw is not None:\n        for x1, y1, x2, y2 in raw[:, 0, :]:\n            dx = float(x2 - x1)\n            dy = float(y2 - y1)\n            length = math.hypot(dx, dy)\n            if length < min_line:\n                continue\n            axis_tol = max(2.0, length * 0.012)\n            if abs(dy) <= axis_tol:\n                horizontal.append(\n                    ((float(y1) + float(y2)) / 2.0, min(x1, x2), max(x1, x2))\n                )\n            elif abs(dx) <= axis_tol:\n                vertical.append(\n                    ((float(x1) + float(x2)) / 2.0, min(y1, y2), max(y1, y2))\n                )\n\n    # Deterministic orientation-specific morphology supplements Hough.  It\n    # extracts only long, narrow edge components; broad filled regions, text\n    # blobs and short furniture details do not become line evidence here.\n    morph_len = max(12, int(round(min_line * 0.55)))\n    narrow_limit = max(8, int(round(short_side * 0.006)))\n    for orientation, kernel in (\n        (\"horizontal\", cv2.getStructuringElement(cv2.MORPH_RECT, (morph_len, 1))),\n        (\"vertical\", cv2.getStructuringElement(cv2.MORPH_RECT, (1, morph_len))),\n    ):\n        opened = cv2.morphologyEx(edges, cv2.MORPH_OPEN, kernel)\n        count, _labels, stats, centroids = cv2.connectedComponentsWithStats(\n            opened, 8\n        )\n        for index in range(1, count):\n            x, y, comp_w, comp_h, _area = [int(v) for v in stats[index]]\n            cx, cy = float(centroids[index][0]), float(centroids[index][1])\n            if orientation == \"horizontal\":\n                if comp_w < min_line or comp_h > narrow_limit:\n                    continue\n                horizontal.append((cy, float(x), float(x + comp_w - 1)))\n            else:\n                if comp_h < min_line or comp_w > narrow_limit:\n                    continue\n                vertical.append((cx, float(y), float(y + comp_h - 1)))\n\n    def cluster(rows: list[tuple[float, float, float]], orientation: str) -> list[_LineGroup]:\n        if not rows:\n            return []\n        rows.sort(key=lambda row: row[0])\n        clusters: list[list[tuple[float, float, float]]] = []\n        coord_tolerance = max(2.0, short_side * 0.0018)\n        for row in rows:\n            if not clusters:\n                clusters.append([row])\n                continue\n            centre = sum(item[0] for item in clusters[-1]) / len(clusters[-1])\n            if abs(row[0] - centre) <= coord_tolerance:\n                clusters[-1].append(row)\n            else:\n                clusters.append([row])\n        groups: list[_LineGroup] = []\n        for items in clusters:\n            coord = float(np.median([item[0] for item in items]))\n            intervals = _merge_intervals(\n                [(float(item[1]), float(item[2])) for item in items],\n                gap=max_gap,\n            )\n            if intervals:\n                groups.append(\n                    _LineGroup(orientation=orientation, coord=coord, intervals=intervals)\n                )\n        return groups\n\n    return cluster(horizontal, \"horizontal\"), cluster(vertical, \"vertical\")\n'''
          source = source[:start] + replacement + source[end:]

          # Preserve opening gaps while stitching collinear wall-band fragments\n          # that Hough / morphology may still split around a door.\n          marker = '    return kept\n\n\ndef _network_filter('
          if source.count(marker) != 1:
              raise SystemExit(f'expected one wall-band return marker, found {source.count(marker)}')
          stitch = '''    # Join only collinear wall-band fragments separated by an opening-sized\n    # gap.  The gap stays explicit in ``gaps`` and is not included in solid\n    # masonry length.\n    stitched = list(kept)\n    stitch_centre_tol = max(3.0, expected_t * 0.45)\n    changed = True\n    while changed:\n        changed = False\n        for i, first in enumerate(stitched):\n            for j in range(i + 1, len(stitched)):\n                second = stitched[j]\n                if first.orientation != second.orientation:\n                    continue\n                if abs(first.coord - second.coord) > stitch_centre_tol:\n                    continue\n                if first.end < second.start:\n                    axis_gap = second.start - first.end\n                elif second.end < first.start:\n                    axis_gap = first.start - second.end\n                else:\n                    axis_gap = 0.0\n                if axis_gap > max_opening_gap:\n                    continue\n                first_sep = first.edge_b - first.edge_a\n                second_sep = second.edge_b - second.edge_a\n                if abs(first_sep - second_sep) > expected_t * 0.45:\n                    continue\n\n                combined_solid = _merge_intervals(\n                    list(first.solid_intervals) + list(second.solid_intervals)\n                )\n                logical = _logical_intervals(combined_solid, max_opening_gap)\n                if len(logical) != 1:\n                    continue\n                pieces, gaps = logical[0]\n                representative = min(\n                    (first, second),\n                    key=lambda item: abs((item.edge_b - item.edge_a) - expected_t),\n                )\n                first_weight = max(first.solid, 1.0)\n                second_weight = max(second.solid, 1.0)\n                coord = (\n                    first.coord * first_weight + second.coord * second_weight\n                ) / (first_weight + second_weight)\n                merged = _BandRun(\n                    orientation=first.orientation,\n                    coord=coord,\n                    edge_a=representative.edge_a,\n                    edge_b=representative.edge_b,\n                    intervals=[(pieces[0][0], pieces[-1][1])],\n                    solid_intervals=list(pieces),\n                    gaps=list(gaps),\n                )\n                stitched.pop(j)\n                stitched.pop(i)\n                stitched.append(merged)\n                changed = True\n                break\n            if changed:\n                break\n    return stitched\n\n\ndef _network_filter('''
          source = source.replace(marker, stitch, 1)
          path.write_text(source, encoding='utf-8')

          test_path = Path('tests/benchmarks/test_mutation_raster_wall_network_evidence.py')
          tests = test_path.read_text(encoding='utf-8')
          old = '''        # Main divider spans essentially the full 6m building depth and carries\n        # the deliberately inserted 1m opening.\n        main = max(vertical, key=lambda run: run.span_length_m)\n        assert main.span_length_m == pytest.approx(6.0, abs=0.25)\n'''
          new = '''        # Main divider spans between the inner faces of the 200mm exterior\n        # walls and carries the deliberately inserted 1m opening.\n        main = max(vertical, key=lambda run: run.span_length_m)\n        assert main.span_length_m == pytest.approx(5.6, abs=0.25)\n'''
          if tests.count(old) != 1:
              raise SystemExit(f'expected one main-divider assertion block, found {tests.count(old)}')
          test_path.write_text(tests.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run focused tests before commit
        run: |
          pip install pytest PyMuPDF==1.28.0 numpy==2.3.5 opencv-python-headless==4.14.0.94 ruff
          export PYTHONPATH=.
          pytest -q tests/benchmarks/test_mutation_raster_wall_network_evidence.py
          python -m compileall -q pb_raster_wall_network_evidence.py
          ruff check --select F821,F823 pb_raster_wall_network_evidence.py tests/benchmarks/test_mutation_raster_wall_network_evidence.py
      - name: Commit successful fix and remove bootstrap workflow
        run: |
          rm .github/workflows/f31_apply_morphology_fix.yml
          git config user.name 'BrycePremierBW'
          git config user.email 'bryce@premierbw.com.au'
          git add pb_raster_wall_network_evidence.py tests/benchmarks/test_mutation_raster_wall_network_evidence.py .github/workflows/f31_apply_morphology_fix.yml
          git commit -m 'fix(F31): supplement Hough with deterministic raster wall edges [f31-morphology]'
          git push origin HEAD:feat/f31-raster-wall-network-evidence