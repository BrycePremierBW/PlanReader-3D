name: F27 Ghazi Wall Topology Probe

on:
  push:
    branches: [diag/f27-ghazi-wall-topology]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused dependencies
        run: pip install PyMuPDF==1.28.0
      - name: Download hash-verified Ghazi source
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' -o /tmp/ghazi.pdf
          echo 'c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  /tmp/ghazi.pdf' | sha256sum -c -
      - name: Bind verandah label, bay chains and pole label
        run: |
          python - <<'PY'
          import re
          import fitz
          from pb_dimension_chain_evidence_extractor import extract_dimension_chains_from_page
          from pb_structural_bay_pillar_count import derive_support_count_from_bay_chain, find_uniform_bay_runs

          doc=fitz.open('/tmp/ghazi.pdf')
          page=doc[166]
          words=page.get_text('words') or []

          def bbox_for_phrase(tokens):
              target=[t.lower() for t in tokens]
              rows=[]
              for i in range(len(words)-len(target)+1):
                  got=[str(words[i+j][4]).strip('.,:;()').lower() for j in range(len(target))]
                  if got==target:
                      xs=[float(words[i+j][0]) for j in range(len(target))]+[float(words[i+j][2]) for j in range(len(target))]
                      ys=[float(words[i+j][1]) for j in range(len(target))]+[float(words[i+j][3]) for j in range(len(target))]
                      rows.append((min(xs),min(ys),max(xs),max(ys)))
              return rows

          print('VERANDAH_BBOXES', bbox_for_phrase(['VERANDAH']))
          print('RHS_STEEL_POLES_BBOXES', bbox_for_phrase(['RHS','Steel','Poles']))
          print('STEEL_POLES_BBOXES', bbox_for_phrase(['Steel','Poles']))

          for w in words:
              token=str(w[4]).strip()
              if re.search(r'RHS|pole|verand',token,re.I):
                  print('KEYWORD_WORD',tuple(round(float(v),2) for v in w[:4]),token)

          chains=extract_dimension_chains_from_page(page,page_num=167,view_id='page_167')
          repeated=[]
          for c in chains:
              vals=[round(float(o.value_m),4) for o in c.observations]
              if len(vals)>=2:
                  res=derive_support_count_from_bay_chain(vals)
                  if res.status=='resolved':
                      boxes=[o.bbox for o in c.observations if o.bbox]
                      x0=min(b[0] for b in boxes); y0=min(b[1] for b in boxes)
                      x1=max(b[2] for b in boxes); y1=max(b[3] for b in boxes)
                      repeated.append((c.chain_id,vals,res.support_count,(x0,y0,x1,y1)))
          print('REPEATED_CHAIN_CANDIDATES')
          for row in repeated: print(row)

          text=page.get_text('text') or ''
          parsed=[]
          for major,minor in re.findall(r'\b(\d{1,2})[,.]?(\d{3})\b',text):
              v=float(major)+float(minor)/1000.0
              if 2.0<=v<=35.0: parsed.append(round(v,3))
          print('FLAT_PARSED_DIMS',parsed)
          flat_runs=find_uniform_bay_runs(parsed)
          print('FLAT_BAY_RUN_COUNT',len(flat_runs))
          for r in flat_runs: print('FLAT_RUN',r)

          print('LOWER_PLAN_WORDS')
          for w in words:
              if 400 <= float(w[1]) <= 500 and float(w[0]) < 650:
                  print(tuple(round(float(v),2) for v in w[:4]),w[4])
          doc.close()
          PY
