name: F24 Schedule OCR Probe V2

on:
  push:
    branches:
      - 'diag/f23-wall-opening-evidence'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f23-wall-opening-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install targeted OCR dependencies
        run: |
          python -m pip install PyMuPDF==1.28.0
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr >/dev/null
      - name: OCR one schedule crop
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          python - <<'PY'
          import fitz
          doc=fitz.open('/tmp/murera.pdf')
          page=doc[222]
          for name,clip in [
              ('schedule', fitz.Rect(0,150,610,455)),
              ('schedule_fullleft', fitz.Rect(0,100,615,520)),
          ]:
              pix=page.get_pixmap(matrix=fitz.Matrix(5,5), clip=clip, alpha=False)
              pix.save(f'/tmp/{name}.png')
              print(name, pix.width, pix.height)
          PY
          echo '=== OCR schedule psm6 ==='
          tesseract /tmp/schedule.png stdout -l eng --psm 6 2>/dev/null || true
          echo '=== OCR schedule psm11 ==='
          tesseract /tmp/schedule.png stdout -l eng --psm 11 2>/dev/null || true
          echo '=== OCR full-left psm11 ==='
          tesseract /tmp/schedule_fullleft.png stdout -l eng --psm 11 2>/dev/null || true
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f24_schedule_ocr_probe_v2.yml
          git commit -m 'chore: remove temporary F24 OCR v2 diagnostic'
          git push origin HEAD:diag/f23-wall-opening-evidence
