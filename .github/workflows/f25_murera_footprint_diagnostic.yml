name: F25 Murera Footprint Diagnostic

on:
  push:
    branches:
      - 'diag/f23-wall-opening-evidence'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f23-wall-opening-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyMuPDF
        run: python -m pip install PyMuPDF==1.28.0
      - name: Inspect footprint evidence only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          echo "sha256=$(sha256sum /tmp/murera.pdf | awk '{print $1}')"
          python - <<'PY'
          import re
          import fitz
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_dimension_chain_evidence_extractor import extract_dimension_chains_from_page

          pdf='/tmp/murera.pdf'
          doc=fitz.open(pdf)
          ex=GenericPlanReaderExtractor()

          print('=== CURRENT FLOOR / BED OUTPUTS ===')
          for p in ex.extract_from_pdf(pdf):
              if p.tag in {'floor_screed','substructure_surface_bed','substructure_bed_dpm','substructure_a142_mesh','perimeter_walling','damp_proof_course'}:
                  print(p.to_dict())

          print('\n=== ARCHITECTURAL PAGES / COMPONENT WORDING ===')
          kw=re.compile(r'floor\s*plan|laboratory|preparation|prep\b|store\b|verand|corridor|passage|walkway|apron|porch|covered|terrace|entrance|office|lobby|room|dimension|overall|grid',re.I)
          for p_idx in range(len(doc)):
              page=doc[p_idx]
              text=page.get_text('text')
              if not ex.is_drawing_page(text):
                  continue
              lines=[(i,l) for i,l in enumerate(text.splitlines()) if kw.search(l)]
              chains=extract_dimension_chains_from_page(page,page_num=p_idx+1,view_id=f'p{p_idx+1}')
              big=[]
              for c in chains:
                  vals=[round(o.value_m,3) for o in c.observations]
                  s=round(c.segment_sum_m,3)
                  if s>=5 or any(v>=5 for v in vals) or len(vals)>=4:
                      big.append((c.chain_id,s,vals,[tuple(round(x,1) for x in o.bbox) for o in c.observations]))
              if lines or big:
                  print('\nPAGE',p_idx+1)
                  for i,l in lines[:120]:
                      print(f'  TEXT {i:04d}: {l}')
                  for item in big[:100]:
                      print('  CHAIN',item)

          print('\n=== RAW DIMENSION CANDIDATES ON FLOOR-PLAN PAGES ===')
          for p_idx in range(len(doc)):
              text=doc[p_idx].get_text('text')
              low=text.lower()
              if ex.is_drawing_page(text) and 'floor plan' in low:
                  vals=[]
                  for major,minor in re.findall(r'\b(\d{1,2})[,.]?(\d{3})\b',text):
                      v=float(major)+float(minor)/1000.0
                      if 0.5 <= v <= 40:
                          vals.append(round(v,3))
                  print('PAGE',p_idx+1,'dims=',vals)
          PY
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f25_murera_footprint_diagnostic.yml
          git commit -m 'chore: remove temporary F25 footprint diagnostic'
          git push origin HEAD:diag/f23-wall-opening-evidence
