name: F25 Wire Raster Eligibility

on:
  push:
    branches:
      - codex/f25-portable-raster-ocr-main

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/f25-portable-raster-ocr-main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Wire generic sparse-raster page classifier
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('pb_planreader_pdf_extractor.py')
          text=path.read_text(encoding='utf-8')
          old='''            from pb_portable_raster_ocr import (\n                extract_opening_instance_evidence,\n                resolve_cross_page_opening_instances,\n            )\n\n            ocr_engine = DrawingOCREngine()\n            dwg_pages = [p for p in target_pages if 0 <= p < len(doc) and self.is_drawing_page(doc[p].get_text("text"))]\n            raster_instance_evidence = []\n'''
          new='''            from pb_portable_raster_ocr import (\n                extract_opening_instance_evidence,\n                resolve_cross_page_opening_instances,\n            )\n            from pb_raster_page_classifier import is_sparse_raster_ocr_candidate\n\n            ocr_engine = DrawingOCREngine()\n            dwg_pages = []\n            for candidate_idx in target_pages:\n                if candidate_idx < 0 or candidate_idx >= len(doc):\n                    continue\n                candidate_page = doc[candidate_idx]\n                candidate_text = candidate_page.get_text("text") or ""\n                if self.is_drawing_page(candidate_text) or is_sparse_raster_ocr_candidate(\n                    candidate_page, candidate_text\n                ):\n                    dwg_pages.append(candidate_idx)\n            raster_instance_evidence = []\n'''
          if old not in text:
              raise SystemExit('F25 OCR page-selection anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate eligibility wiring
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt ruff
          pip install rapidocr==3.9.2 onnxruntime==1.29.0
          python -m compileall -q pb_raster_page_classifier.py pb_planreader_pdf_extractor.py
          ruff check --select F821,F823 pb_raster_page_classifier.py pb_planreader_pdf_extractor.py tests/benchmarks/test_mutation_raster_page_classifier.py
          PYTHONPATH=. pytest -q \
            tests/benchmarks/test_mutation_raster_page_classifier.py \
            tests/benchmarks/test_mutation_portable_raster_opening_instances.py \
            tests/benchmarks/test_mutation_drawing_ocr_evidence.py \
            tests/benchmarks/test_mutation_ocr_evidence_layer_wiring.py
          ! grep -Ei 'kstvet|murera|expected_boq|benchmark_results|tenders_ke' pb_raster_page_classifier.py pb_planreader_pdf_extractor.py
      - name: Commit validated wiring and remove this workflow
        run: |
          git config user.name 'Bryce Curran'
          git config user.email 'bryce@premierbw.com.au'
          git rm .github/workflows/f25_wire_raster_eligibility.yml
          git add pb_planreader_pdf_extractor.py pb_raster_page_classifier.py tests/benchmarks/test_mutation_raster_page_classifier.py
          git diff --cached --check
          git commit -m 'feat(F25): admit sparse raster drawing sheets to OCR evidence lane'
          git push origin HEAD:codex/f25-portable-raster-ocr-main
