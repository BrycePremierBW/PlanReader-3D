name: F26 Brick Vent Reconciliation Diagnostic

on:
  push:
    branches:
      - 'diag/f23-wall-opening-evidence'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f23-wall-opening-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyMuPDF
        run: python -m pip install PyMuPDF==1.28.0
      - name: Inspect vent evidence only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          python - <<'PY'
          import re
          import fitz
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor

          doc=fitz.open('/tmp/murera.pdf')
          ex=GenericPlanReaderExtractor()
          print('=== QUALIFYING VENT PAGES ===')
          for p_idx in range(len(doc)):
              page=doc[p_idx]
              text=page.get_text('text')
              if not ex.is_drawing_page(text):
                  continue
              clean=text
              matches=list(re.finditer(r'\bPV\b|\bPermanent Vent\b|\bBrick Vent\b',clean,re.I))
              if matches:
                  lower=text.lower()
                  qualifies=len(matches)>=2 and any(k in lower for k in ('elevation','facade','façade','section','wall'))
                  print('PAGE',p_idx+1,'count=',len(matches),'qualifies=',qualifies,'sheet=',ex.extract_sheet_number(text,p_idx+1))
                  for i,line in enumerate(text.splitlines()):
                      if re.search(r'\bPV\b|Permanent Vent|Brick Vent|elevation|section',line,re.I):
                          print(f'  {i:04d}: {line}')
          print('\n=== CURRENT PREDICTION ===')
          for p in ex.extract_from_pdf('/tmp/murera.pdf'):
              if p.tag=='brick_vents':
                  print(p.to_dict())
          PY
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f26_brick_vent_reconciliation_diagnostic.yml
          git commit -m 'chore: remove temporary F26 vent diagnostic'
          git push origin HEAD:diag/f23-wall-opening-evidence
