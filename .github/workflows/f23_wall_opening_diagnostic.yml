name: F23 Wall Opening Diagnostic

on:
  push:
    branches:
      - diag/f23-wall-opening-evidence

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f23-wall-opening-evidence

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyMuPDF
        run: python -m pip install PyMuPDF==1.28.0

      - name: Inspect drawing evidence only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o /tmp/kstvet.pdf
          echo "sha256=$(sha256sum /tmp/kstvet.pdf | awk '{print $1}')"
          python - <<'PY'
          import re
          import fitz
          from pb_level_datum_extraction import find_level_markers
          from pb_dimension_chain_evidence_extractor import extract_dimension_chains_from_page
          from pb_dimension_graph_constraint_engine import resolve_wall_height, resolve_wall_thickness

          doc = fitz.open('/tmp/kstvet.pdf')
          page = doc[53]
          text = page.get_text('text')
          print('=== MATCHING RAW LINES ===')
          pats = re.compile(r'W1|3[,.]?000|2[,.]?400|2[,.]?500|2[,.]?700|2[,.]?800|3[,.]?150|ceiling|roof\s*level|floor\s*level|ground\s*level|height|head|lintel|plaster|pillar|CHS|verand', re.I)
          for i, line in enumerate(text.splitlines()):
              if pats.search(line):
                  print(f'{i:04d}: {line}')

          print('\n=== LEVEL MARKERS ===')
          markers = find_level_markers(text, source_page=54, view_id='p54')
          for m in markers:
              print(m)
          print('resolved_wall_height=', resolve_wall_height(markers))

          print('\n=== DIMENSION CHAINS ===')
          chains = extract_dimension_chains_from_page(page, page_num=54, view_id='p54')
          for c in chains:
              vals = [round(o.value_m,4) for o in c.observations]
              if any(2.0 <= v <= 4.0 for v in vals) or len(vals) >= 3:
                  print(c.chain_id, 'sum=', round(c.segment_sum_m,4), 'vals=', vals,
                        'bbox=', [o.bbox for o in c.observations])
          print('resolved_wall_thickness=', resolve_wall_thickness(chains))

          print('\n=== W1 / 3000 BLOCKS ===')
          blocks = page.get_text('blocks')
          for idx, b in enumerate(blocks):
              btxt = b[4].strip().replace('\n', ' ')
              if re.search(r'\bW1\b|3[,.]?000\s*mm|3[,.]?000.*casement|casement.*3[,.]?000', btxt, re.I):
                  print('BLOCK', idx, 'bbox=', tuple(round(x,1) for x in b[:4]), 'text=', repr(btxt))

          print('\n=== WORDS NEAR W1/3000 ===')
          words = page.get_text('words')
          targets = []
          for w in words:
              token = w[4]
              if re.search(r'^W1$|^3[,.]?000(?:mm)?$', token, re.I):
                  targets.append(w)
          for t in targets:
              tx0, ty0, tx1, ty1 = t[:4]
              print('TARGET', t)
              nearby = []
              for w in words:
                  x0,y0,x1,y1 = w[:4]
                  if abs(((x0+x1)/2)-((tx0+tx1)/2)) <= 120 and abs(((y0+y1)/2)-((ty0+ty1)/2)) <= 80:
                      nearby.append((round(x0,1), round(y0,1), w[4]))
              print('NEAR', nearby)

          print('\n=== VECTOR DRAWING COUNTS / RECTS ===')
          drawings = page.get_drawings()
          print('drawing_objects=', len(drawings))
          rects=[]
          for d in drawings:
              r=d.get('rect')
              if r:
                  w=r.width; h=r.height
                  if 5 < w < 250 and 5 < h < 250:
                      rects.append((round(r.x0,1),round(r.y0,1),round(r.x1,1),round(r.y1,1),round(w,1),round(h,1)))
          print('candidate_rects_sample=', rects[:150])
          PY

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f23_wall_opening_diagnostic.yml
          git commit -m 'chore: remove temporary F23 diagnostic workflow'
          git push origin HEAD:diag/f23-wall-opening-evidence
