name: TEST ONLY GPT2 Maryborough Grid Component Completion

on:
  pull_request:
    branches: [ main ]
    paths:
      - "pb_*room*.py"
      - "pb_*wall*.py"
      - "pb_live_physical_net_wall_integration.py"
      - "tests/test_source_*room*.py"
      - "tests/test_gpt2_named_room_metric_first_gates.py"
      - "tools/diag_gpt2_named_room_metric_first_gates.py"
      - ".github/workflows/test_gpt2_maryborough_grid_component_completion.yml"

concurrency:
  group: gpt2-maryborough-grid-component-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maryborough-grid-component:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Run exact Maryborough room-component proof
        run: |
          set -o pipefail
          OUT=artifacts/gpt2-maryborough-grid-component
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/head_sha.txt"
          sha256sum "documents/sources/Arch_Combined_Maryborough_Service_Station.pdf" > "$OUT/source_sha256.txt"
          PYTHONPATH=. python -u - <<'PY' 2>&1 | tee "$OUT/result.json"
          import hashlib,json,time
          from pathlib import Path
          from pb_live_physical_net_wall_integration import collect_live_physical_net_wall_claim

          path=Path("documents/sources/Arch_Combined_Maryborough_Service_Station.pdf")
          source_sha=hashlib.sha256(path.read_bytes()).hexdigest()
          assert source_sha == "b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007"
          started=time.perf_counter()
          claim=collect_live_physical_net_wall_claim(
              path,
              pages=(6,),
              topology_pages=(6,),
              room_area_support_pages=(10,),
          )
          elapsed=time.perf_counter()-started

          def norm(value):
              return " ".join(str(value or "").strip().upper().split())

          labelled=[
              {
                  "label":norm(room.room_label),
                  "canonical_room_id":room.canonical_room_id,
                  "source_room_face_record_id":room.source_room_face_record_id,
                  "decision_scope_id":room.decision_scope_id,
                  "area_page_pts2":room.area_page_pts2,
                  "geometry_complete":room.geometry_complete,
                  "evidence_ids":list(room.evidence_ids),
              }
              for room in claim.canonical_rooms if norm(room.room_label)
          ]
          labels=sorted({row["label"] for row in labelled})
          from tools.diag_gpt2_named_room_metric_first_gates import (
              summarize_named_room_metric_first_gates,
          )
          named_metric_ledger=summarize_named_room_metric_first_gates(claim)
          # Exercise the identical production floor publication gate used by
          # GPT1. Source room-area controls alone do not prove floor handoff.
          from pb_live_floor_area_quantity_publication import (
              publish_live_floor_area_quantities,
          )
          published_floors=publish_live_floor_area_quantities(claim)
          floor_handoff=[
              {
                  "quantity_id":q.quantity_id,
                  "upstream_room_area_quantity_id":dict(q.metadata or {}).get(
                      "upstream_room_area_quantity_id"
                  ),
                  "value_m2":q.value,
                  "unit":q.unit,
              }
              for q in published_floors
          ]
          assert len({row["quantity_id"] for row in floor_handoff})==len(floor_handoff)
          assert all(
              row["upstream_room_area_quantity_id"] and row["unit"]=="m2"
              and float(row["value_m2"])>0
              for row in floor_handoff
          )
          firm={
              norm(dict(q.metadata or {}).get("room_label")):float(q.value)
              for q in claim.room_area_quantity_evidence
              if not q.abstained and q.value is not None
          }

          # Independent owner-provided source dimension controls; not used
          # as producer inputs or frozen benchmark expected quantities.
          for label,expected in (
              ("FOOD PREP",13.270425),
              ("COLD ROOM",25.37875),
              ("OFFICE",9.05352),
          ):
              assert abs(firm[label]-expected) < 1e-9
              matching=[row for row in labelled if row["label"]==label]
              assert len(matching)==1
              assert matching[0]["geometry_complete"]
              assert matching[0]["source_room_face_record_id"]
              assert matching[0]["evidence_ids"]
          for label in ("DRY STORE","WASH UP","M-AMB","F-AMB"):
              assert label not in labels
              assert label not in firm

          observed={
              name:[row for row in labelled if row["label"]==name]
              for name in (
                  "POS COUNTER",
                  "FOOD SERVICE",
                  "TRUCK DRIVER LOUNGE",
                  "FREEZER",
                  "SALES",
              )
          }
          print(json.dumps({
              "original_source_sha256_verified":source_sha,
              "elapsed_seconds":elapsed,
              "canonical_room_count":len(claim.canonical_rooms),
              "canonical_floor_count":len(claim.canonical_floors),
              "labels":labels,
              "observed_geometry_targets":observed,
              "firm_room_areas":firm,
              "production_floor_area_quantity_handoff":floor_handoff,
              "production_floor_area_quantity_count":len(floor_handoff),
              **named_metric_ledger,
              "status":getattr(claim.status,"value",str(claim.status)),
              "reason_codes":list(claim.reason_codes),
          },indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-maryborough-grid-component
          path: artifacts/gpt2-maryborough-grid-component
          retention-days: 1
