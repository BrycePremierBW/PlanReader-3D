name: F26 Wire Explicit Floor Area

on:
  push:
    branches: [codex/f26-geometry-accuracy]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded source patch
        run: python scripts/f26_apply_explicit_floor_area.py
      - name: Install focused test dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Validate F26
        run: python -m compileall -q pb_explicit_floor_area_evidence.py pb_planreader_pdf_extractor.py && PYTHONPATH=. python -m pytest -q tests/benchmarks/test_mutation_explicit_floor_area_evidence.py
      - name: Commit validated wiring
        run: |
          rm .github/workflows/f26_wire_explicit_floor_area.yml
          rm scripts/f26_apply_explicit_floor_area.py
          git config user.name "Bryce Curran"
          git config user.email "bryce@premierbw.com.au"
          git add pb_planreader_pdf_extractor.py .github/workflows/f26_wire_explicit_floor_area.yml scripts/f26_apply_explicit_floor_area.py
          git commit -m "feat(F26): wire explicit drawing floor-area authority"
          git push origin HEAD:codex/f26-geometry-accuracy
