name: F31 Ghazi Plan Crop

on:
  push:
    branches: [diag/f31-ghazi-vector-wall-network]

permissions:
  contents: read

jobs:
  crop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f31-ghazi-vector-wall-network
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install PyMuPDF==1.28.0
      - run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1739211305954-tender-document-for-construction-of-science-laboratory-at-ghazi-primary-school.pdf' -o /tmp/ghazi.pdf
          echo 'c8c001c9dadb791e7cb18b7bea19ce795eebba2f9b9eb7dec4844212da4d8f4f  /tmp/ghazi.pdf' | sha256sum -c -
      - name: Render floor-plan crop
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import fitz
          doc=fitz.open('/tmp/ghazi.pdf')
          page=doc[166]
          clip=fitz.Rect(90,150,615,470)
          pix=page.get_pixmap(matrix=fitz.Matrix(3,3), clip=clip, alpha=False)
          pix.save('diagnostics/f31_ghazi_plan_crop.png')
          doc.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f31-ghazi-plan-crop
          path: diagnostics/f31_ghazi_plan_crop.png
          if-no-files-found: error
          retention-days: 1