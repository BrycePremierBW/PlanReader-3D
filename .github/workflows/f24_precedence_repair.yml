name: F24 Evidence Precedence Repair

on:
  push:
    branches:
      - codex/f24-generic-opening-binding

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/f24-generic-opening-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Apply and validate precedence repair
        run: |
          python scripts/f24_precedence_repair.py
          python -m compileall -q pb_raster_schedule_extractor.py
          PYTHONPATH=. pytest -q \
            tests/benchmarks/test_mutation_raster_cad_schedules.py \
            tests/benchmarks/test_mutation_generic_opening_binding_wiring.py \
            tests/benchmarks/test_mutation_leakage_cleanup.py \
            tests/benchmarks/test_mutation_ocr_evidence_layer_wiring.py
          ! grep -Ei 'tenders_ke|kstvet|murera|expected_boq|benchmark_results' pb_raster_schedule_extractor.py
      - name: Commit production and regression repair
        run: |
          git config user.name 'Bryce Curran'
          git config user.email 'bryce@premierbw.com.au'
          git rm .github/workflows/f24_precedence_repair.yml scripts/f24_precedence_repair.py
          git add pb_raster_schedule_extractor.py tests/benchmarks/test_mutation_raster_cad_schedules.py
          git diff --cached --check
          git commit -m 'fix(F24): preserve complete opening schedule evidence'
          git push origin HEAD:codex/f24-generic-opening-binding
