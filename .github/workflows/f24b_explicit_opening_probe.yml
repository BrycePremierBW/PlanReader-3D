name: F25 Source View Context Probe

on:
  push:
    branches:
      - codex/f24b-explicit-opening-recovery

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install source inspection dependency
        run: pip install PyMuPDF==1.28.0
      - name: Download hash-verified development drawing source
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o /tmp/source_b.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/source_b.pdf' | sha256sum -c -
      - name: Print native source context around image-heavy opening views
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import fitz
          doc=fitz.open('/tmp/source_b.pdf')
          for page_no in range(220, 231):
              page=doc[page_no-1]
              text=' | '.join(line.strip() for line in (page.get_text('text') or '').splitlines() if line.strip())
              print(f'PAGE {page_no} images={len(page.get_images(full=True))} chars={len(text)} TEXT={text[:1800]}')
          doc.close()
          PY
