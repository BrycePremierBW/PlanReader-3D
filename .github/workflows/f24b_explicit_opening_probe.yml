name: F24B Explicit Opening Probe

on:
  push:
    branches:
      - codex/f24b-explicit-opening-recovery

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install probe dependencies
        run: pip install PyMuPDF==1.28.0 Pillow==12.3.0 numpy==2.3.5 rapidocr==3.9.2 onnxruntime==1.29.0
      - name: Download hash-verified development drawing source
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' -o /tmp/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/kstvet.pdf' | sha256sum -c -
      - name: OCR source-discovered opening sheet for explicit identities
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import re
          import fitz
          import numpy as np
          from PIL import Image, ImageEnhance
          from rapidocr import RapidOCR

          engine = RapidOCR()
          doc = fitz.open('/tmp/kstvet.pdf')
          page = doc[53]  # page 54, discovered by the prior native-evidence probe
          tag_re = re.compile(r'^\s*(?:W|D)\s*[-_.]?\s*\d{1,3}\s*$', re.I)
          opening_re = re.compile(r'window|door|casement|batten|glaz', re.I)
          dpi = 220
          r = page.rect
          cols = rows = 3
          ov = .06
          tw, th = r.width/cols, r.height/rows
          detections = []
          for iy in range(rows):
              for ix in range(cols):
                  clip = fitz.Rect(
                      max(r.x0, r.x0+ix*tw-tw*ov),
                      max(r.y0, r.y0+iy*th-th*ov),
                      min(r.x1, r.x0+(ix+1)*tw+tw*ov),
                      min(r.y1, r.y0+(iy+1)*th+th*ov),
                  )
                  pix = page.get_pixmap(clip=clip, dpi=dpi, alpha=False)
                  img = Image.frombytes('RGB',[pix.width,pix.height],pix.samples)
                  for variant_name, variant in (
                      ('raw', img),
                      ('contrast', ImageEnhance.Contrast(img).enhance(1.35)),
                  ):
                      result = engine(np.asarray(variant))
                      txts = getattr(result,'txts',None) or []
                      scores = getattr(result,'scores',None) or []
                      boxes = getattr(result,'boxes',None)
                      if boxes is None:
                          continue
                      scale = 72.0/dpi
                      for i, raw in enumerate(txts):
                          text = ' '.join(str(raw).split()).strip()
                          if not text:
                              continue
                          pts = boxes[i].tolist() if hasattr(boxes[i],'tolist') else boxes[i]
                          xs=[float(p[0]) for p in pts]; ys=[float(p[1]) for p in pts]
                          bbox=(clip.x0+min(xs)*scale,clip.y0+min(ys)*scale,clip.x0+max(xs)*scale,clip.y0+max(ys)*scale)
                          detections.append((text,float(scores[i]) if i<len(scores) else 0.0,bbox,variant_name))
          kept=[]
          for text,conf,bbox,variant in sorted(detections,key=lambda x:-x[1]):
              cx=(bbox[0]+bbox[2])/2; cy=(bbox[1]+bbox[3])/2
              duplicate=False
              for pt,pc,pb,pv in kept:
                  if text.lower()!=pt.lower():
                      continue
                  pcx=(pb[0]+pb[2])/2; pcy=(pb[1]+pb[3])/2
                  ix=max(0,min(bbox[2],pb[2])-max(bbox[0],pb[0])); iy=max(0,min(bbox[3],pb[3])-max(bbox[1],pb[1])); inter=ix*iy
                  a=max(1,(bbox[2]-bbox[0])*(bbox[3]-bbox[1])); b=max(1,(pb[2]-pb[0])*(pb[3]-pb[1])); iou=inter/(a+b-inter) if a+b-inter else 0
                  if iou>=.25 or (abs(cx-pcx)<=6 and abs(cy-pcy)<=6):
                      duplicate=True; break
              if not duplicate:
                  kept.append((text,conf,bbox,variant))

          tags=[]
          for text,conf,bbox,variant in kept:
              if tag_re.fullmatch(text) and conf >= .70:
                  tags.append((text,conf,bbox,variant))
          print('TAGS',[(t,round(c,3),tuple(round(v,1) for v in b),vr) for t,c,b,vr in sorted(tags,key=lambda x:((x[2][1]+x[2][3])/2,(x[2][0]+x[2][2])/2))])
          for tag,conf,bbox,variant in sorted(tags,key=lambda x:-x[1]):
              cx=(bbox[0]+bbox[2])/2; cy=(bbox[1]+bbox[3])/2
              nearby=[]
              for text2,conf2,bbox2,var2 in kept:
                  if (text2,conf2,bbox2,var2)==(tag,conf,bbox,variant):
                      continue
                  cx2=(bbox2[0]+bbox2[2])/2; cy2=(bbox2[1]+bbox2[3])/2
                  if abs(cx2-cx)<=180 and abs(cy2-cy)<=70:
                      nearby.append((((cx2-cx)**2+(cy2-cy)**2)**0.5,text2,conf2,bbox2))
              print('NEAR',tag,[(round(d,1),txt,round(cf,3),tuple(round(v,1) for v in bb)) for d,txt,cf,bb in sorted(nearby)[:20]])
          print('OPENING_TEXT',[ (txt,round(cf,3),tuple(round(v,1) for v in bb)) for txt,cf,bb,var in kept if opening_re.search(txt) and cf>=.65][:80])
          doc.close()
          PY
