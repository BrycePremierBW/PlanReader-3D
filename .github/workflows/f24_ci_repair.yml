name: F24 CI Repair

on:
  push:
    branches:
      - codex/f24-generic-opening-binding

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/f24-generic-opening-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic repair
        run: |
          python scripts/f24_ci_repair.py
          python -m compileall -q pb_raster_schedule_extractor.py tests/benchmarks/test_mutation_generic_opening_binding_wiring.py tests/benchmarks/test_mutation_leakage_cleanup.py tests/benchmarks/test_mutation_ocr_evidence_layer_wiring.py
          ! grep -Ei 'tenders_ke|kstvet|murera|expected_boq|benchmark_results' pb_raster_schedule_extractor.py
      - name: Commit production and test repair
        run: |
          git config user.name 'Bryce Curran'
          git config user.email 'bryce@premierbw.com.au'
          git rm .github/workflows/f24_ci_repair.yml scripts/f24_ci_repair.py
          git add pb_raster_schedule_extractor.py tests/benchmarks/test_mutation_generic_opening_binding_wiring.py tests/benchmarks/test_mutation_leakage_cleanup.py tests/benchmarks/test_mutation_ocr_evidence_layer_wiring.py
          git diff --cached --check
          git commit -m 'fix(F24): make explicit opening schedules detector-independent'
          git push origin HEAD:codex/f24-generic-opening-binding
