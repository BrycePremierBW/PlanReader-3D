name: F23 Murera Support Semantics

on:
  push:
    branches:
      - 'diag/f23-wall-opening-evidence'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f23-wall-opening-evidence

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyMuPDF
        run: python -m pip install PyMuPDF==1.28.0

      - name: Inspect Murera drawing support evidence only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          echo "sha256=$(sha256sum /tmp/murera.pdf | awk '{print $1}')"
          python - <<'PY'
          import re
          import fitz
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_structural_bay_pillar_count import find_uniform_bay_runs

          pdf='/tmp/murera.pdf'
          doc=fitz.open(pdf)
          ex=GenericPlanReaderExtractor()

          print('=== DRAWING PAGES WITH SUPPORT WORDS ===')
          for p_idx in range(len(doc)):
              page=doc[p_idx]
              text=page.get_text('text')
              if not ex.is_drawing_page(text):
                  continue
              if re.search(r'\bpier|\bcolumn|\bpillar|\bpost|300\s*[xX]\s*300|TRUSS', text, re.I):
                  print('PAGE', p_idx+1)
                  lines=text.splitlines()
                  for i,line in enumerate(lines):
                      if re.search(r'\bpier|\bcolumn|\bpillar|\bpost|300\s*[xX]\s*300|TRUSS|\bNo\.?S?\b', line, re.I):
                          print(f'  {i:04d}: {line}')
                  dims=[]
                  for major,minor in re.findall(r'\b(\d{1,2})[,.]?(\d{3})\b', text):
                      v=float(major)+float(minor)/1000.0
                      if 2.0 <= v <= 35.0:
                          dims.append(round(v,3))
                  runs=find_uniform_bay_runs(dims)
                  if runs:
                      print('  BAY_RUNS', runs)

          print('\n=== CURRENT EXTRACTOR SUPPORT OUTPUTS ===')
          preds=ex.extract_from_pdf(pdf)
          for p in preds:
              if p.tag in {'structural_columns','masonry_piers','verandah_pillars','roof_trusses'}:
                  print(p.to_dict())
          PY

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f23_murera_support_semantics.yml
          git commit -m 'chore: remove temporary Murera support diagnostic workflow'
          git push origin HEAD:diag/f23-wall-opening-evidence
