name: F24 Validate

on:
  push:
    branches:
      - codex/f24-generic-opening-binding

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-ci-v1228.txt ]; then pip install -r requirements-ci-v1228.txt; fi
          pip install ruff
      - name: Focused regression and leakage checks
        run: |
          python -m compileall -q pb_opening_tag_normalization.py pb_raster_schedule_extractor.py pb_planreader_pdf_extractor.py
          ruff check --select F821,F823 pb_opening_tag_normalization.py pb_raster_schedule_extractor.py pb_planreader_pdf_extractor.py tests/benchmarks/test_mutation_generic_opening_tag_normalization.py tests/benchmarks/test_mutation_generic_opening_binding_wiring.py
          pytest -q \
            tests/benchmarks/test_mutation_generic_opening_tag_normalization.py \
            tests/benchmarks/test_mutation_generic_opening_binding_wiring.py \
            tests/benchmarks/test_mutation_raster_cad_schedules.py \
            tests/benchmarks/test_mutation_drawing_evidence_binding.py \
            tests/benchmarks/test_mutation_contextual_opening_tags.py
          ! grep -Ei 'tenders_ke|kstvet|murera|expected_boq|benchmark_results' pb_opening_tag_normalization.py
          ! grep -E 'sched_spec_w1|sched_spec_w2|sched_spec_d1|w1_occs|w2_occs|d1_occs' pb_planreader_pdf_extractor.py
      - name: Download verified public benchmark sources
        run: |
          mkdir -p benchmarks/sources
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' \
            -o benchmarks/sources/1727358888238-bq-nd-drawing.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  benchmarks/sources/1727358888238-bq-nd-drawing.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o benchmarks/sources/1785347143869-bqs-drawings.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  benchmarks/sources/1785347143869-bqs-drawings.pdf' | sha256sum -c -
      - name: Canonical benchmark summary and hallucination diagnostics
        run: |
          rm -rf /tmp/f24-benchmark
          python pb_benchmark_accuracy_engine.py --all --output-dir /tmp/f24-benchmark
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/f24-benchmark/headline_accuracy_dashboard.json').read_text())
          h = d['headline_metrics']
          print('CANONICAL_HEADLINE', h['overall_accuracy_percentage'])
          print('COMPARED', h['total_items_compared'])
          print('EXACT', h['exact_matches'])
          print('WITHIN_5', h['within_5_percent'])
          print('MISSED', h['missed_items'])
          print('HALLUCINATED', h['hallucinated_items'])
          for report in d.get('headline_reports', []):
              s = report['summary']
              print('PROJECT_SUMMARY', report['benchmark_id'], s['overall_accuracy_percentage'], s['total_items_compared'], s['exact_matches'], s['within_5_percent'], s['missed_items'], s['hallucinated_items'])
              for item in report.get('item_results', []):
                  if item.get('status') == 'hallucinated_item':
                      print('HALLUCINATION', report['benchmark_id'], item.get('item_id'), repr(item.get('description')), item.get('extracted_quantity'), item.get('drawing_page'), repr(item.get('notes')))
          PY
