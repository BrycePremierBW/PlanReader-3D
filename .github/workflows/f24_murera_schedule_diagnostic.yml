name: F24 Murera Schedule Diagnostic

on:
  push:
    branches:
      - 'diag/f23-wall-opening-evidence'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f23-wall-opening-evidence

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyMuPDF
        run: python -m pip install PyMuPDF==1.28.0

      - name: Inspect schedule evidence only
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          echo "sha256=$(sha256sum /tmp/murera.pdf | awk '{print $1}')"
          python - <<'PY'
          import re
          import fitz
          from pb_planreader_pdf_extractor import GenericPlanReaderExtractor
          from pb_raster_schedule_extractor import GenericScheduleTableExtractor

          pdf='/tmp/murera.pdf'
          doc=fitz.open(pdf)
          ex=GenericPlanReaderExtractor()
          sx=GenericScheduleTableExtractor()

          print('=== PAGE 223 RAW TEXT ===')
          page=doc[222]
          text=page.get_text('text')
          for i,line in enumerate(text.splitlines()):
              if re.search(r'\bW\d+\b|\bD\d+\b|window|door|casement|flush|\bno\.?\b|quantity|qty|size|type', line, re.I):
                  print(f'{i:04d}: {line}')

          print('\n=== PAGE 223 BLOCKS ===')
          for idx,b in enumerate(page.get_text('blocks')):
              btxt=b[4].strip().replace('\n',' | ')
              if re.search(r'\bW\d+\b|\bD\d+\b|window|door|casement|flush|\bno\.?\b', btxt, re.I):
                  print('BLOCK',idx,'bbox=',tuple(round(v,1) for v in b[:4]),'text=',repr(btxt))

          print('\n=== PAGE 223 TABLES ===')
          try:
              tabs=page.find_tables()
              print('table_count=', len(tabs.tables) if tabs else 0)
              if tabs:
                  for ti,t in enumerate(tabs.tables):
                      print('TABLE',ti,'bbox=',t.bbox)
                      data=t.extract()
                      for ri,row in enumerate(data):
                          print(' ROW',ri,row)
          except Exception as exc:
              print('find_tables_error=',repr(exc))

          print('\n=== GENERIC SCHEDULE ROWS PAGE 223 ===')
          rows=sx.extract_from_page(page,223)
          for r in rows:
              print(r.to_dict())

          print('\n=== GENERIC SCHEDULE ROWS ALL DRAWING PAGES ===')
          dwg_pages=[i for i in range(len(doc)) if ex.is_drawing_page(doc[i].get_text('text'))]
          all_rows=sx.extract_from_document(doc,pages=dwg_pages)
          for r in all_rows:
              if r.trade_type in {'windows','doors'}:
                  print(r.to_dict())

          print('\n=== CURRENT EXTRACTOR WINDOW/DOOR OUTPUTS ===')
          preds=ex.extract_from_pdf(pdf)
          for p in preds:
              if p.trade_type in {'windows','doors'} or p.tag in {'steel_casement_windows','doors_complete'}:
                  print(p.to_dict())
          PY

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f24_murera_schedule_diagnostic.yml
          git commit -m 'chore: remove temporary Murera schedule diagnostic workflow'
          git push origin HEAD:diag/f23-wall-opening-evidence
