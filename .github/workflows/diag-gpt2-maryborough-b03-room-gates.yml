name: DIAG GPT2 Maryborough B03 Room First Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/diag_gpt2_room_measurement_gates.py"
      - "pb_quantity_takeoff_adapter.py"
      - "tests/test_gpt3_family_claim_identity.py"
      - "tests/test_gpt2_b03_room_measurement_gates.py"
      - ".github/workflows/diag-gpt2-maryborough-b03-room-gates.yml"
  workflow_dispatch:

jobs:
  real-source-room-first-gates:
    runs-on: ubuntu-latest
    # Original SHA-verified B03 production needed ~41 minutes before the
    # customer/sealing stage was added. A 45-minute cap cancelled the prior
    # genuine source run without recording a source result; allow bounded
    # headroom for full original-source + customer parity checks.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Frozen V2 integrity
        run: PYTHONPATH=. python scripts/check_full_plan_v2_integrity.py
      - name: Test first-gate diagnostic
        run: PYTHONPATH=. pytest -q tests/test_gpt2_b03_room_measurement_gates.py
      - name: Source-first exact Maryborough room closure
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/gpt2-b03-room-gates
          git rev-parse HEAD > artifacts/gpt2-b03-room-gates/head_sha.txt
          PYTHONPATH=. python -u tools/diag_gpt2_room_measurement_gates.py \
            --pdf documents/sources/Arch_Combined_Maryborough_Service_Station.pdf \
            --expected-sha256 b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007 \
            --pages 6 --topology-pages 6 --support-pages 10 \
            --output artifacts/gpt2-b03-room-gates/room_first_gates.json \
            2>&1 | tee artifacts/gpt2-b03-room-gates/log.txt
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(
              "artifacts/gpt2-b03-room-gates/room_first_gates.json"
          ).read_text())
          rooms=report["rooms"]
          if not rooms:
              print("B03_UPSTREAM_ROOM_RECOVERY_REGRESSION", json.dumps({
                  "canonical_room_status":report.get("canonical_room_status"),
                  "canonical_room_reason_codes":report.get("canonical_room_reason_codes"),
                  "canonical_wall_status":report.get("canonical_wall_status"),
                  "canonical_wall_reason_codes":report.get("canonical_wall_reason_codes"),
                  "claim_reason_codes":report.get("claim_reason_codes"),
              }, sort_keys=True))
              raise AssertionError(
                  "Expected real source-owned Maryborough rooms are absent; "
                  "upstream physical room recovery must be repaired before B03 "
                  "documented-area proof can pass"
              )
          print("B03_FIRST_GATE_COUNTS", json.dumps({
              gate:sum(r["first_unclosed_gate"]==gate for r in rooms)
              for gate in sorted({r["first_unclosed_gate"] for r in rooms})
          },sort_keys=True))
          # Never assume a label denotes a unique physical room.
          seen={}
          for row in rooms:
              seen.setdefault(row["room_label"],[]).append(row)
          for label in ("FOOD PREP","OFFICE","COLD ROOM"):
              if len(seen.get(label,[]))==1:
                  row=seen[label][0]
                  print("B03_MEASUREMENT_CONTROL",json.dumps({
                      "label":label,"first_gate":row["first_unclosed_gate"],
                      "metric_area_m2":row["metric_area_m2"],
                      "source_face":row["source_room_face_record_id"],
                      "canonical_floor":row["canonical_floor_id"],
                  },sort_keys=True))
          assert report["source_sha256"]=="b1be53531412005f42937c89d0cfce66fbbe608315016bbb56731029ffc9e007"
          # These are independent production source receipts from the already
          # SHA-verified B03 run, NOT benchmark reference quantities. Confirm
          # the newer canonical floor duplicate-identity guard did not erase
          # source-authenticated quantities or silently skip customer output.
          controls={
              "FOOD PREP":(13.270425,
                  "floor_area_quantity_d62c2f382a0c773ec36f",
                  "canonical_room_area_quantity_a691af59bcb8a78c474d"),
              "OFFICE":(9.05352,
                  "floor_area_quantity_8bcdc01455538a6a105a",
                  "canonical_room_area_quantity_3b2be6bc2f91a42ee569"),
              "COLD ROOM":(25.37875,
                  "floor_area_quantity_6b28b3abaedf519631ed",
                  "canonical_room_area_quantity_409cc3811baafced5beb"),
          }
          assert report["source_closed_floor_seal_quantity_count"]>=len(controls), report
          assert report["verified_floor_customer_row_count"]>=len(controls), report
          assert report["floor_customer_projection_failure_type"] is None, report
          assert report["commercial_estimator_approved"] is False
          assert report["benchmark_accuracy"] is None
          for label,(area,floor_quantity_id,room_quantity_id) in controls.items():
              matched=seen.get(label,())
              assert len(matched)==1, (label,matched)
              row=matched[0]
              assert abs(float(row["metric_area_m2"])-area)<1e-9, (label,row)
              assert row["floor_area_reissued_quantity_id"]==floor_quantity_id, row
              assert row["canonical_room_area_reissued_quantity_id"]==room_quantity_id, row
              assert row["floor_area_source_sealed"] is True, row
              assert row["floor_area_customer_row_verified"] is True, row
              assert row["first_unclosed_gate"]=="CUSTOMER_REVIEW_ROW_VERIFIED_UNSCORED", row
          print("GPT3_MARYBOROUGH_CUSTOMER_SOURCE_PROOF",json.dumps({
              "source_sha256":report["source_sha256"],
              "verified_rows":report["verified_floor_customer_row_count"],
              "control_labels":sorted(controls),
              "commercial_estimator_approved":False,
              "benchmark_accuracy":None,
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt2-b03-maryborough-first-gates
          path: artifacts/gpt2-b03-room-gates
          retention-days: 5
