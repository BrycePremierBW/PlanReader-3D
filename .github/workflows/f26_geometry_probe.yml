name: F26 Geometry Accuracy Probe

on:
  push:
    branches:
      - codex/f26-geometry-accuracy

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci-v1228.txt
      - name: Download hash-verified development PDFs
        run: |
          mkdir -p /tmp/f26
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1727358888238-bq-nd-drawing.pdf' -o /tmp/f26/kstvet.pdf
          echo '6856bfa739aa136dd8e0bf17cb25fd43d0d31c9c3dfe3252525454f09d8fa4dc  /tmp/f26/kstvet.pdf' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' -o /tmp/f26/murera.pdf
          echo '84dec737ede7adfa32b02c6732d4289a6a2d25f7ae50cf07209428f1b4e0c94b  /tmp/f26/murera.pdf' | sha256sum -c -
      - name: Print baseline geometry predictions and residuals
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          from pb_benchmark_accuracy_engine import BenchmarkAccuracyEngine
          from pb_public_tender_benchmark import PublicTenderBenchmark

          cases=[
            ('tenders_ke_kstvet_cbc_classroom',Path('/tmp/f26/kstvet.pdf')),
            ('tenders_ke_murera_science_lab',Path('/tmp/f26/murera.pdf')),
          ]
          eng=BenchmarkAccuracyEngine(output_dir='/tmp/f26/results')
          accepted=compared=0
          for bid,pdf in cases:
              bench=PublicTenderBenchmark.load(bid,base_dir='benchmarks/public_tenders')
              pages=None
              for d in bench.download_manifest.get('documents',[]):
                  if d.get('role') in ('architectural_drawings','drawings','tender_drawings'):
                      dp=d.get('drawing_pages')
                      if dp and len(dp)==2:
                          pages=list(range(dp[0]-1,dp[1])); break
              preds=eng.extract_quantities_from_pdf(pdf,pages=pages)
              print('\n===',bid,'===')
              for p in sorted(preds,key=lambda x:str(x.get('tag',''))):
                  print('PRED',p)
              report=eng.evaluate_benchmark(bid,pdf_path=pdf,predictions=preds)
              print('REPORT',report.overall_accuracy_percentage,'exact',report.exact_matches,'within5',report.within_5_percent,'gross',report.gross_mismatches,'missed',report.missed_items,'hall',report.hallucinated_items,'total',report.total_items_compared)
              for item in report.item_results:
                  print('ITEM',item.to_dict())
              accepted += report.exact_matches + report.within_5_percent
              compared += report.total_items_compared
          print('COMBINED',accepted,compared,round(accepted/compared*100,2))
          PY
      - name: Inspect source dimension and footprint evidence on Murera plan/sections
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import re, fitz
          doc=fitz.open('/tmp/f26/murera.pdf')
          for page_no in range(219,231):
              p=doc[page_no-1]
              text=p.get_text('text') or ''
              terms=[]
              for ln in text.splitlines():
                  s=' '.join(ln.split())
                  if re.search(r'verand|floor plan|dimension|\b\d{1,2}[,.]\d{3}\b|\b\d{4,5}\b|ground floor|overall|external',s,re.I):
                      terms.append(s)
              if terms:
                  print('\nSOURCE_PAGE',page_no)
                  for t in terms[:160]: print(t)
          doc.close()
          PY
      - name: Verify production files remain benchmark-clean
        run: python scripts/check_benchmark_gold_separation.py
