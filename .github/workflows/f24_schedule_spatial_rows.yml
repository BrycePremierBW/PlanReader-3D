name: F24 Schedule Spatial Rows

on:
  push:
    branches:
      - 'diag/f23-wall-opening-evidence'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/f23-wall-opening-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyMuPDF
        run: python -m pip install PyMuPDF==1.28.0
      - name: Inspect schedule spatial geometry
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://tenders.go.ke/storage/Documents/1785347143869-bqs-drawings.pdf' \
            -o /tmp/murera.pdf
          python - <<'PY'
          import fitz
          from collections import defaultdict

          doc=fitz.open('/tmp/murera.pdf')
          page=doc[222]
          print('page_rect=', page.rect)

          words=[w for w in page.get_text('words') if 220 <= w[1] <= 430]
          rows=defaultdict(list)
          for w in words:
              key=round(((w[1]+w[3])/2)/3)*3
              rows[key].append(w)
          print('=== WORD ROWS y=220..430 ===')
          for y in sorted(rows):
              ws=sorted(rows[y], key=lambda w:w[0])
              print('ROW', y, '::', ' | '.join(f'{w[4]}@x{w[0]:.1f}-{w[2]:.1f},y{w[1]:.1f}-{w[3]:.1f}' for w in ws))

          print('\n=== VECTOR LINES / RECTS y=220..430 ===')
          seen=set()
          for di,d in enumerate(page.get_drawings()):
              r=d.get('rect')
              if r and r.y1 >= 210 and r.y0 <= 440:
                  print('DRAW',di,'rect=',tuple(round(v,1) for v in (r.x0,r.y0,r.x1,r.y1)),'items=',len(d.get('items',[])))
                  for item in d.get('items',[]):
                      if not item:
                          continue
                      typ=item[0]
                      if typ=='l':
                          p1,p2=item[1],item[2]
                          if max(p1.y,p2.y)>=210 and min(p1.y,p2.y)<=440:
                              sig=(round(p1.x,1),round(p1.y,1),round(p2.x,1),round(p2.y,1))
                              if sig not in seen:
                                  seen.add(sig)
                                  print('  LINE',sig)
                      elif typ=='re':
                          rr=item[1]
                          if rr.y1>=210 and rr.y0<=440:
                              sig=(round(rr.x0,1),round(rr.y0,1),round(rr.x1,1),round(rr.y1,1))
                              if sig not in seen:
                                  seen.add(sig)
                                  print('  RECT',sig)

          print('\n=== TEXT BLOCKS y=220..430 ===')
          for bi,b in enumerate(page.get_text('blocks')):
              if b[3]>=210 and b[1]<=440:
                  print('BLOCK',bi,'bbox=',tuple(round(v,1) for v in b[:4]),'::',repr(b[4].strip().replace('\n',' | ')))
          PY
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/f24_schedule_spatial_rows.yml
          git commit -m 'chore: remove temporary F24 schedule-spatial diagnostic'
          git push origin HEAD:diag/f23-wall-opening-evidence
